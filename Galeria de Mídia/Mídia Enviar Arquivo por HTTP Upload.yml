info:
  name: Mídia Enviar Arquivo por HTTP Upload
  type: http
  seq: 3
  tags:
    - Mídia

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/media"
  headers:
    - name: Content-Type
      value: "multipart/form-data"
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: path
      value: '/pasta'
      type: query
      description: 'Pasta de destino. Sem esse parametro envia para a raiz'
      disabled: true
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: ''
        description: 'Arquivo enviado via upload multipart'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Content-Type
          value: "multipart/form-data"
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta de destino. Sem esse parametro envia para a raiz'
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ''
            description: 'Arquivo enviado via upload multipart'
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","arquivo":{"name":"logo.png","path":"\/custom\/109\/uploads\/api-teste\/logo.png","url":"https:\/\/loja.com.br\/custom\/109\/uploads\/api-teste\/logo.png"}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Content-Type
          value: "multipart/form-data"
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta de destino. Sem esse parametro envia para a raiz'
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ''
            description: 'Arquivo enviado via upload multipart'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Content-Type
          value: "multipart/form-data"
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta de destino. Sem esse parametro envia para a raiz'
          disabled: true
      body:
        type: multipart-form
        data:
          - name: file
            type: text
            value: ''
            description: 'Arquivo enviado via upload multipart'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Extens\u00e3o inv\u00e1lida para o arquivo (script.php em \/pasta)."}'

docs: |-
  <p>O parâmetro <code>path</code> indica a pasta dentro da galeria de mídia do site. Sem ele, a operação
  acontece na raiz.</p>

  <p>As pastas usadas internamente pelos módulos (<code>album</code>, <code>product</code>,
  <code>banner</code>, <code>cadastro</code>, <code>anuncio</code>, <code>header</code>,
  <code>wishlist</code>, <code>xml</code>, <code>import-files</code>) não aparecem na galeria.
  As fotos do álbum de conteúdo são gerenciadas por <code>/api/content/:id/fotos</code>.</p>

  <p>O nome original do arquivo é preservado. As extensões <code>php</code>, <code>php3</code>,
  <code>exe</code>, <code>perl</code> e <code>sh</code> são bloqueadas.</p>
