info:
  name: Mídia Listagem
  type: http
  seq: 1
  tags:
    - Mídia

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/media"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: path
      value: '/pasta'
      type: query
      description: 'Pasta a ser listada. Sem esse parametro lista a raiz'
      disabled: true
    - name: limit
      value: '200'
      type: query
      description: 'Itens por pagina (default 200)'
      disabled: true
    - name: page
      value: ''
      type: query
      description: 'Pagina da listagem (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

