info:
  name: Mídia Renomear
  type: http
  seq: 6
  tags:
    - Mídia

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/media?file=logo.png&new_name=logo-novo.png"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: path
      value: '/pasta'
      type: query
      description: 'Pasta onde esta o arquivo (opcional)'
      disabled: true
    - name: file
      value: 'logo.png'
      type: query
      description: 'Nome atual do arquivo ou pasta'
    - name: new_name
      value: 'logo-novo.png'
      type: query
      description: 'Novo nome'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/media?file=logo.png&new_name=logo-novo.png"
      method: PUT
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta onde esta o arquivo (opcional)'
          disabled: true
        - name: file
          value: 'logo.png'
          type: query
          description: 'Nome atual do arquivo ou pasta'
        - name: new_name
          value: 'logo-novo.png'
          type: query
          description: 'Novo nome'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success"}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/media?file=logo.png&new_name=logo-novo.png"
      method: PUT
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta onde esta o arquivo (opcional)'
          disabled: true
        - name: file
          value: 'logo.png'
          type: query
          description: 'Nome atual do arquivo ou pasta'
        - name: new_name
          value: 'logo-novo.png'
          type: query
          description: 'Novo nome'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/media?file=logo.png&new_name=logo-novo.png"
      method: PUT
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta onde esta o arquivo (opcional)'
          disabled: true
        - name: file
          value: 'logo.png'
          type: query
          description: 'Nome atual do arquivo ou pasta'
        - name: new_name
          value: 'logo-novo.png'
          type: query
          description: 'Novo nome'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Informe os atributos \"file\" e \"new_name\"."}'

docs: |-
  <p>O parâmetro <code>path</code> indica a pasta dentro da galeria de mídia do site. Sem ele, a operação
  acontece na raiz.</p>

  <p>As pastas usadas internamente pelos módulos (<code>album</code>, <code>product</code>,
  <code>banner</code>, <code>cadastro</code>, <code>anuncio</code>, <code>header</code>,
  <code>wishlist</code>, <code>xml</code>, <code>import-files</code>) não aparecem na galeria.
  As fotos do álbum de conteúdo são gerenciadas por <code>/api/content/:id/fotos</code>.</p>
