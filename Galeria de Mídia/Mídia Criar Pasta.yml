info:
  name: Mídia Criar Pasta
  type: http
  seq: 5
  tags:
    - Mídia

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/media"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: path
      value: '/pasta'
      type: query
      description: 'Pasta pai. Sem esse parametro cria na raiz'
      disabled: true
  body:
    type: form-urlencoded
    data:
      - name: acao
        value: 'mkdir'
        description: 'Informe "mkdir" para criar uma pasta'
      - name: name
        value: 'nova-pasta'
        description: 'Nome da pasta a ser criada'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta pai. Sem esse parametro cria na raiz'
          disabled: true
      body:
        type: form-urlencoded
        data:
          - name: acao
            value: ''
            description: 'Informe "mkdir" para criar uma pasta'
          - name: name
            value: ''
            description: 'Nome da pasta a ser criada'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","pasta":{"name":"nova-pasta","path":"\/custom\/109\/uploads\/nova-pasta"}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta pai. Sem esse parametro cria na raiz'
          disabled: true
      body:
        type: form-urlencoded
        data:
          - name: acao
            value: ''
            description: 'Informe "mkdir" para criar uma pasta'
          - name: name
            value: ''
            description: 'Nome da pasta a ser criada'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/media"
      method: POST
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: path
          value: '/pasta'
          type: query
          description: 'Pasta pai. Sem esse parametro cria na raiz'
          disabled: true
      body:
        type: form-urlencoded
        data:
          - name: acao
            value: ''
            description: 'Informe "mkdir" para criar uma pasta'
          - name: name
            value: ''
            description: 'Nome da pasta a ser criada'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"J\u00e1 existe uma pasta com esse nome (nova-pasta em \/)."}'

docs: |-
  <p>O parâmetro <code>path</code> indica a pasta dentro da galeria de mídia do site. Sem ele, a operação
  acontece na raiz.</p>

  <p>As pastas usadas internamente pelos módulos (<code>album</code>, <code>product</code>,
  <code>banner</code>, <code>cadastro</code>, <code>anuncio</code>, <code>header</code>,
  <code>wishlist</code>, <code>xml</code>, <code>import-files</code>) não aparecem na galeria.
  As fotos do álbum de conteúdo são gerenciadas por <code>/api/content/:id/fotos</code>.</p>
