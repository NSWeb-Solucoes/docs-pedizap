info:
  name: Produto Detalhe (Busca por SKU)
  type: http
  seq: 3
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto/"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: code
      value: "{{produtoSKU}}"
      type: query
    - name: detail_photos
      value: "1"
      type: query
      description: String - Opcional - Retornar o array detalhado de fotos
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/produto/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: code
          value: "{{produtoSKU}}"
          type: query
        - name: detail_photos
          value: "1"
          type: query
          description: String - Opcional - Retornar o array detalhado de fotos
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"pagina":1,"totalRegistros":0,"totalGeralRegistros":"0","totalPaginas":1,"registroInicio":0,"registroFim":0,"produtos":{"produto":[]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: code
          value: "{{produtoSKU}}"
          type: query
        - name: detail_photos
          value: "1"
          type: query
          description: String - Opcional - Retornar o array detalhado de fotos
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: <p>Para buscar as informações de somente um produto, o <b>sku</b> dele deve ser adicionado ao parametro <b>code</b></p>
