info:
  name: Produto Listagem
  type: http
  seq: 1
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: search
      value: Teste descrição teste
      type: query
      description: String - Optional - Busca por textos no title, code e resume do produto
      disabled: true
    - name: q
      value: Teste descrição teste
      type: query
      description: String - Optional - Busca por textos no title, code e resume do produto
      disabled: true
    - name: searchlike
      value: "1"
      type: query
      description: Boolean - Optional - Força a busca do 'search' e 'q', á usarem LIKE nos campos 'title', 'code' e 'resume', dessa forma você evita o cache do FULLTEXT.
      disabled: true
    - name: pids
      value: 55,85,78,963
      type: query
      description: String - Optional - Buscar por ids especificos (Se caso usar as queries 'search' ou 'q', a busca por id não será feita).
      disabled: true
    - name: hideids
      value: 10,20,30
      type: query
      description: String - Optional - Ids de produtos que tevem ser removidos da busca. Será considerado indepedente do 'search' e 'q'
      disabled: true
    - name: promo
      value: "1"
      type: query
      description: Boolean - Optional - Filtra somente produtos em promoção
      disabled: true
    - name: featured
      value: "1"
      type: query
      description: Boolean - Optional - Filtra somente produtos em destaque
      disabled: true
    - name: onlysubprod
      value: "1"
      type: query
      description: Boolean - Optional - Filtra somente subprodutos
      disabled: true
    - name: subprod
      value: "1"
      type: query
      description: Boolean - Optional - Filtra tanto produtos e subprodutos. Por padrão mostra somente produtos
      disabled: true
    - name: code
      value: re25df478e
      type: query
      description: String - Optional - Buscar pelo SKU do produto
      disabled: true
    - name: preco
      value: 30-80
      type: query
      description: String - Optional - Filtro por faixa de preço {[min]-[max]}
      disabled: true
    - name: marca
      value: "5"
      type: query
      description: String - Optional - Id da marca (manufacturer_id)
      disabled: true
    - name: fabricante
      value: "5"
      type: query
      description: String - Optional - Id do fabricante (manufacturer_id), mantendo a retrocompatibilidade com integração antiga
      disabled: true
    - name: genero
      value: M
      type: query
      description: String - Optional - Filtra o genêro do produto (M/F)
      disabled: true
    - name: category
      value: "8"
      type: query
      description: String - Optional - Id da categoria (category_id), com essa query também é pego o limit e order da categoria passada
      disabled: true
    - name: c
      value: "52"
      type: query
      description: String - Optional - Id da categoria (category_id). não é pego limit e order da categoria.
      disabled: true
    - name: grupo
      value: "12"
      type: query
      description: String - Optional - Produtos listados dentro de um grupo de vitrine. Caso queira respeitar as regras do grupo independente da 'category' informata da query use 'grupofu' ao invês de 'grupo'. A query 'c' sempre afetará a busca por grupo.
      disabled: true
    - name: lastupdate_lte
      value: 01/12/2024
      type: query
      description: String - Optional - Atualizados antes de determinada data
      disabled: true
    - name: lastupdate_gte
      value: 01/12/2023
      type: query
      description: String - Optional - Atualizados depois de determinada data
      disabled: true
    - name: created_lte
      value: 01/12/2024
      type: query
      description: String - Optional - Criados antes de determinada data
      disabled: true
    - name: created_gte
      value: 01/12/2023
      type: query
      description: String - Optional - Criados depois de determinada data
      disabled: true
    - name: limit
      value: "50"
      type: query
      description: String - Optional - Quantidade de items por pagina. Se caso for usado a query 'category' ele pegará o limit da categoria.
      disabled: true
    - name: order
      value: ""
      type: query
      description: String - Optional - Ordenação da lista. Se caso for usado a query 'category' ele pegará a ordenação da categoria
      disabled: true
    - name: page
      value: "3"
      type: query
      description: String - Opcional - Numero da pagina a ser buscada
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

