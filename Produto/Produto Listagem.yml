    request:
      url: "{{proto}}://{{domain}}/api/produto"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: search
          value: Teste descrição teste
          type: query
          description: String - Optional - Busca por textos no title, code e resume do produto
        - name: q
          value: Teste descrição teste
          type: query
          description: String - Optional - Busca por textos no title, code e resume do produto
        - name: searchlike
          value: "1"
          type: query
          description: Boolean - Optional - Força a busca do 'search' e 'q', á usarem LIKE nos campos 'title', 'code' e 'resume', dessa forma você evita o cache do FULLTEXT.
        - name: pids
          value: 55,85,78,963
          type: query
          description: String - Optional - Buscar por ids especificos (Se caso usar as queries 'search' ou 'q', a busca por id não será feita).
        - name: hideids
