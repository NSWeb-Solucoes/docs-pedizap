info:
  name: Produto Editar (Busca por SKU)
  type: http
  seq: 7
  tags:
    - Produtos

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/produto?code={{produtoSKU}}"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: code
      value: "{{produtoSKU}}"
      type: query
  body:
    type: form-urlencoded
    data:
      - name: price
        value: "10"
        description: Preco base do produto
      - name: price_promo
        value: "5.5"
        description: Preco promocional do produto
      - name: estoque_quantidade
        value: "10"
        description: Quantidade em estoque disponivel
      - name: name
        value: Novo Nome
        description: Nome do produto
      - name: extras_json
        value: ""
        description: JSON com as categorias de complementos (grupos de extras) do produto, no mesmo formato usado no POST de criacao
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoSKU"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoSKU
          value: "{{produtoSKU}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: price
            value: ""
            description: Preco base do produto
          - name: price_promo
            value: ""
            description: Preco promocional do produto
          - name: estoque_quantidade
            value: ""
            description: Quantidade em estoque disponivel
          - name: name
            value: ""
            description: Nome do produto
          - name: extras_json
            value: ""
            description: JSON com as categorias de complementos (grupos de extras) do produto, no mesmo formato usado no POST de criacao
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","affectedRows":1}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoSKU"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoSKU
          value: "{{produtoSKU}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: price
            value: ""
            description: Preco base do produto
          - name: price_promo
            value: ""
            description: Preco promocional do produto
          - name: estoque_quantidade
            value: ""
            description: Quantidade em estoque disponivel
          - name: name
            value: ""
            description: Nome do produto
          - name: extras_json
            value: ""
            description: JSON com as categorias de complementos (grupos de extras) do produto, no mesmo formato usado no POST de criacao
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoSKU"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoSKU
          value: "{{produtoSKU}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: price
            value: ""
            description: Preco base do produto
          - name: price_promo
            value: ""
            description: Preco promocional do produto
          - name: estoque_quantidade
            value: ""
            description: Quantidade em estoque disponivel
          - name: name
            value: ""
            description: Nome do produto
          - name: extras_json
            value: ""
            description: JSON com as categorias de complementos (grupos de extras) do produto, no mesmo formato usado no POST de criacao
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Produto n\u00e3o encontrado."}'

docs: |-
  Ao editar um produto é possível passar o id diretamente na URL ou passar nos parâmetros o campo code (SKU).

  Exemplo de edição com ID: /api/produto/999/

  Exemplo de edição por SKU: /api/produto/?code=999

  <p><strong>Atenção:</strong> a busca por <code>code</code> usa <code>LIKE</code> no banco, não igualdade exata — aceita <code>%</code> como coringa e pode casar (e atualizar) mais de um produto de uma vez. Some com <code>parent_id</code> pra restringir a busca por SKU aos sub-produtos de um pai específico. Veja também <a href="./Produto%20Editar.yml">Produto Editar</a> para atualização em lote por lista de <code>id</code>.</p>
