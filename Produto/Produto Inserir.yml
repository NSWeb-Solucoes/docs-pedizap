docs: |-
  <p>Os únicos campos realmente obrigatórios são:</p>

  <ul>
      <li> <strong>name:</strong> O nome do produto </li>
      <li> <strong>category_id:</strong> O id da categoria ao qual o produto pertence </li>
  </ul>

  <p>Os demais campos do exemplo (<code>code, estoque_quantidade, price, price_promo, resume, published, show_price, regra_exibicao</code>) são opcionais. Também existem outros campos do formulário não presentes no exemplo, todos opcionais: <code>category_id2, mpn, gtin, ncm, genero, manufacturer_id, featured, priority, color, model, size, estoque_controle, estoque_minimo, comprimento, largura, altura, peso, prazo_entrega, prazo_unidade, prazo_usa_quantidade, content, video, cross_sell, relateds, goto, cashback_json</code>.</p>

  <p>É possível anexar uma foto já na criação do produto (sem precisar de uma chamada separada em <code>/api/produto/:id/fotos</code>), enviando um dos três conjuntos de campos: <code>photo_url</code> (URL da imagem), <code>photo_file</code> (upload multipart) ou <code>photo_data</code>+<code>photo_filename</code> (base64) — mais opcionalmente <code>photo_description</code> e <code>photo_featured</code> ("S"/"N"). O mesmo funciona no PUT de edição.</p>
