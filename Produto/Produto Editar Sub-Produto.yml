info:
  name: Produto Editar Sub-Produto
  type: http
  seq: 9
  tags:
    - Produtos

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/produto/:produtoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: price
        value: "124"
        description: Preco base do sub-produto
      - name: price_promo
        value: "123"
        description: Preco promocional do sub-produto
      - name: estoque_quantidade
        value: "32"
        description: Quantidade em estoque disponivel
      - name: parent_id
        value: "{{parentId}}"
        description: Ignorado nesta rota (PUT edita um sub-produto ja existente; o produto pai nao pode ser trocado por aqui)
        disabled: true
      - name: attr_1
        value: Azul
        description: "Valor do 1o atributo dinamico do sub-produto (ex: tamanho/cor), conforme configurado em Model_Loja_Attribute da loja"
      - name: attr_2
        value: ""
        description: Valor do 2o atributo dinamico do sub-produto, se a loja tiver configurado
      - name: attr_3
        value: ""
        description: Valor do 3o atributo dinamico do sub-produto, se a loja tiver configurado
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

