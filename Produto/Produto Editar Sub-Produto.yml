docs: |-
  <p>Esse PUT edita um sub-produto (variação) <strong>já existente</strong> — preço, estoque e atributos. Como em qualquer PUT de produto, é possível editar por id na URL ou por <code>code</code> (SKU), ver <a href="./Produto%20Editar%20(Busca%20por%20SKU).yml">Produto Editar (Busca por SKU)</a>.</p>

  <p><strong>Atenção:</strong> <code>parent_id</code> está no body por referência, mas é ignorado nessa edição — o PUT nunca reatribui o produto pai de um sub-produto já criado.</p>

  <p><strong>Criar</strong> um novo sub-produto é diferente: é feito via <code>POST /api/produto</code> com o parâmetro <code>parent_id</code> (query ou body) apontando pro produto pai. Nesse caso <code>code</code>, <code>price</code> e <code>price_promo</code> são herdados automaticamente do produto pai (podem ser sobrescritos no próprio POST).</p>
