docs: |-
  <p>Cria um sub-produto (variação) de um produto pai já existente. É o mesmo <code>POST /api/produto</code> de <a href="./Produto%20Inserir.yml">Produto Inserir</a>, mas com o parâmetro <code>parent_id</code> (query ou body) apontando pro id do produto pai — isso troca o formulário usado no servidor e muda o comportamento:</p>

  <ul>
    <li><code>code</code>, <code>price</code> e <code>price_promo</code> são herdados automaticamente do produto pai quando omitidos; podem ser sobrescritos enviando-os no body.</li>
    <li><code>category_id</code> não é necessário (nem usado) num sub-produto — ele pertence à mesma categoria do pai.</li>
    <li><code>attr_1</code>, <code>attr_2</code>, <code>attr_3</code>... são os atributos de variação configurados na loja (ex: tamanho, cor) — o número de campos <code>attr_N</code> disponíveis depende de quantos atributos a loja tem cadastrados.</li>
    <li>Um sub-produto não pode ter o mesmo id do produto pai, e precisa de ao menos um atributo informado (senão a API retorna erro "Nenhum atributo informado para o subproduto !").</li>
  </ul>

  <p>Para editar um sub-produto já criado, ou pra herdar comportamento de PUT, veja <a href="./Produto%20Editar%20Sub-Produto.yml">Produto Editar Sub-Produto</a> — atualizar um sub-produto é sempre por PUT, nunca por esse endpoint de criação.</p>
