info:
  name: Produto Inserir Sub-Produto
  type: http
  seq: 5
  tags:
    - Produtos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/produto?parent_id={{produtoId}}"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: parent_id
      value: "{{produtoId}}"
      type: query
  body:
    type: form-urlencoded
    data:
      - name: code
        value: 12345ab
        description: SKU do sub-produto; se omitido, herda o code do produto pai
      - name: price
        value: "32"
        description: Preco base do sub-produto; se omitido, herda o preco do produto pai
      - name: price_promo
        value: "12"
        description: Preco promocional do sub-produto; se omitido, herda o do produto pai
      - name: estoque_quantidade
        value: "3"
        description: Quantidade em estoque disponivel
      - name: attr_1
        value: amarelo
        description: "Valor do 1o atributo dinamico do sub-produto (ex: tamanho/cor), conforme configurado em Model_Loja_Attribute da loja"
      - name: attr_2
        value: "38"
        description: Valor do 2o atributo dinamico do sub-produto, se a loja tiver configurado
      - name: attr_3
        value: "40"
        description: Valor do 3o atributo dinamico do sub-produto, se a loja tiver configurado
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

