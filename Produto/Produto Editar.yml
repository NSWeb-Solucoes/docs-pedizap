info:
  name: Produto Editar
  type: http
  seq: 6
  tags:
    - Produtos

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/produto/:produtoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Novo Nome
        description: Nome do produto
      - name: price
        value: "5.50"
        description: Preco base do produto
      - name: estoque_quantidade
        value: "10"
        description: Quantidade em estoque disponivel
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

