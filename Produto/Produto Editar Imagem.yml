info:
  name: Produto Editar Imagem
  type: http
  seq: 8
  tags:
    - Produtos

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/produto/:produtoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: category_id
        value: "1"
        description: ID da categoria do produto; obrigatorio nesta rota, nao pode ser enviado vazio
      - name: photo_data
        value: ""
        description: Imagem em base64 (usar junto com photo_filename)
        disabled: true
      - name: photo_filename
        value: ""
        description: Nome do arquivo da imagem, exigido junto com photo_data
        disabled: true
      - name: photo_url
        value: ""
        description: URL publica de uma imagem para o servidor baixar e associar ao produto
        disabled: true
      - name: photo_description
        value: ""
        description: Descricao/legenda da foto
        disabled: true
      - name: photo_featured
        value: ""
        description: '"S"/"N" (default "N") - marca a foto como a principal/destaque do produto'
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

