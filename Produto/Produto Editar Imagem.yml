docs: |-
  Atualização no endpoint para alterar a imagem do produto, ele sempre substituirá a imagem atual pela imagem enviada.

  - Imagem hostiada na internet utilizar o **photo_url**
      
  - Imagem codificada em base64 utilizar o **photo_data** e **photo_filename**
      
  - Imagem usando multi-part/file, não está disponivel no **PUT** somente no [POST.](https://documenter.getpostman.com/view/9735682/2s9YRFT9LL#fdcec802-1604-4fbb-818b-208374c32499)

  Opcionalmente também é possível enviar **photo_description** (descrição da foto) e **photo_featured** ("S"/"N", se é a foto principal).
