info:
  name: Produto - Por SKU Detalhe
  type: http
  seq: 6
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto?code={{produtoSKU}}"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: code
      value: "{{produtoSKU}}"
      type: query
    - name: detail_photos
      value: "1"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Produto encontrado
    description: O produto vem com os mesmos campos de Produto Detalhe, dentro da estrutura paginada da listagem (`produtos.produto` é uma lista).
    request:
      url: "{{proto}}://{{domain}}/api/produto?code={{produtoSKU}}"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: code
          value: prod-000032
          type: query
        - name: detail_photos
          value: "1"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"pagina":1,"totalRegistros":1,"totalGeralRegistros":"1","totalPaginas":1,"registroInicio":1,"registroFim":"1","produtos":{"produto":[{"id":"1","site_id":"5095","parent_id":"0","kit":"N","attribute_json":null,"category_id":"1","category_id2":null,"category_path":"1","manufacturer_id":"0","genero":null,"code":"prod-000032","mpn":null,"gtin":null,"name":"Picolé Açai","resume":"Sem descrição","price":"8","price_promo":null,"ncm":null,"content":null,"featured":"N","file_name":"","video":null,"color":null,"model":null,"size":null,"priority":"0","published":"Y","regra_exibicao":"A","show_price":"Y","estoque_controle":"S","estoque_quantidade":"0","estoque_minimo":"0","estoque_reserva":"0","comprimento":null,"largura":null,"altura":null,"peso":null,"prazo_entrega":"0","prazo_unidade":"dia","prazo_usa_quantidade":"N","photo_id":null,"upsell":null,"cross_sell":null,"relateds":null,"subprods":"0","extras_json":"[{\"ref\":\"b9e96ef6-5e7e-4ec1-9d01-ed0374b31d63\",\"category\":\"Escolha seu sabor\",\"rule\":\"\",\"required\":true,\"min\":1,\"max\":1,\"items\":[{\"ref\":\"ab74f10c-4c1e-4858-a561-3cf8725abd82\",\"code\":\"comp-000151\",\"image\":\"\",\"name\":\"A\\u00e7ai\",\"desc\":\"\",\"price\":0,\"published\":true}]}]","horarios_json":null,"created":"2026-06-18 14:07:09","lastupdate":null,"cashback_json":null,"category":{"id":"1","site_id":"5095","parent_id":"0","parent_id_path":null,"name":"Picolés","friendly_url":"picolas","friendly_url_path":null,"icon":null,"image":null,"description":null,"google_category":null,"cashback_multiplier":null,"result_order":null,"count":"0","priority":"1","prodqtde":"11","prodqtde_active":"11","subqtde":"0","subqtde_active":"0","published":"Y","created":"2026-06-18 14:07:09","lastupdate":"2026-06-18 14:15:12"},"category2":[],"manufacturer":[],"link":"https://cardapio.pedizap.com.br/site/produtos/1-picole-acai.html","photos":{"photo":[]}}]}}'
  - name: 200 SKU não encontrado
    description: "Nenhum produto com esse SKU: a resposta é 200 com `totalRegistros` 0 e `produtos.produto` vazia."
    request:
      url: "{{proto}}://{{domain}}/api/produto/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: code
          value: "{{produtoSKU}}"
          type: query
        - name: detail_photos
          value: "1"
          type: query
          description: String - Opcional - Retornar o array detalhado de fotos
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"pagina":1,"totalRegistros":0,"totalGeralRegistros":"0","totalPaginas":1,"registroInicio":0,"registroFim":0,"produtos":{"produto":[]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: code
          value: "{{produtoSKU}}"
          type: query
        - name: detail_photos
          value: "1"
          type: query
          description: String - Opcional - Retornar o array detalhado de fotos
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: <p>Para buscar as informações de somente um produto, o <b>sku</b> dele deve ser adicionado ao parametro <b>code</b></p>
