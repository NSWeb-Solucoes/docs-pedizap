info:
  name: Produto Detalhe
  type: http
  seq: 2
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto/:produtoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: detail_photos
      value: "1"
      type: query
      description: String - Opcional - Retornar o array detalhado de fotos
      disabled: true
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

