docs: |-
  <p>Para inserir uma nova categoria, o nome dela deve ser passado pelo body com a chave <code>name</code></p>

  <p>Alguns comportamentos automáticos quando os campos não são enviados:</p>
  <ul>
    <li><code>friendly_url</code>: gerada a partir do <code>name</code> se não for enviada.</li>
    <li><code>parent_id</code>: quando a categoria é criada como filha via URL aninhada, usa o id da URL como padrão.</li>
    <li><code>result_order</code>: padrão <code>"name ASC"</code>.</li>
    <li><code>published</code>: padrão <code>"Y"</code>.</li>
  </ul>

  <p>Outros campos do formulário não presentes no exemplo, todos opcionais: <code>icon, image, google_category, cashback_multiplier</code>.</p>

  Valores possiveis no **result_order**:

  - name ASC - Nome dos produtos em ordem albabetica.
      
  - code ASC - Codigo SKU dos produto em ordem crescente.
      
  - price ASC - Preço dos produtos menor pro maior.
      
  - price DESC - Preço dos produtos maior pro menor.
      
  - created DESC - Produtos recém cadatrados.
      
  - created ASC - Produtos mais antigos.
