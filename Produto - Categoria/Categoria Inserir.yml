info:
  name: Categoria Inserir
  type: http
  seq: 3
  tags:
    - Categorias

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/categoria"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Abu
        description: Nome da categoria (obrigatorio)
      - name: description
        type: text
        value: ""
        description: Descricao da categoria (opcional)
      - name: parent_id
        type: text
        value: "1"
        description: ID da categoria pai; se omitido e a categoria for criada via URL aninhada, usa o id da URL
      - name: friendly_url
        type: text
        value: ""
        description: URL amigavel da categoria; gerada automaticamente a partir do name se nao for enviada
      - name: published
        type: text
        value: ""
        description: '"Y" ou "N" (default "Y")'
      - name: count
        type: text
        value: ""
        description: Quantidade de produtos exibidos por pagina na categoria
      - name: result_order
        type: text
        value: ""
        description: 'Ordenacao padrao dos produtos na categoria (ex: "name ASC", "priority ASC", "code ASC", "price ASC", "price DESC", "created DESC", "created ASC"); default "name ASC"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

