docs: |-
  <p>Lista as categorias de produto da loja, publicadas ou não (<code>published</code> <code>Y</code>/<code>N</code>), ordenadas por <code>priority</code>. A lista não é paginada.</p>

  <ul>
    <li>Sem <code>parent_id</code>, traz as categorias do primeiro nível (<code>parent_id</code> 0). Com <code>parent_id</code>, traz só as filhas diretas daquela categoria; se ela não tiver filhas ou não existir, <code>categoria</code> vem vazia.</li>
    <li>Cada categoria que tem filhas traz as subcategorias em <code>subcategories.category</code>, com os mesmos campos, em todos os níveis abaixo. Sem filhas, o campo <code>subcategories</code> não aparece.</li>
    <li>Os filtros de data (<code>lastupdate_gte</code>, <code>lastupdate_lte</code>, <code>created_gte</code> e <code>created_lte</code>) valem só para o nível listado: as subcategorias de uma categoria encontrada vêm todas. Eles aceitam <code>AAAA-MM-DD</code>, <code>AAAA-MM-DD HH:MM:SS</code> ou <code>DD/MM/AAAA</code>. Data sem hora vale como meia-noite; para incluir o dia inteiro no <code>_lte</code>, envie <code>23:59:59</code>.</li>
  </ul>

  <p>Campos de contagem e de caminho:</p>

  <ul>
    <li><code>prodqtde</code> e <code>prodqtde_active</code>: produtos vinculados à categoria (todos e só os publicados), sem contar sub-produtos.</li>
    <li><code>subqtde</code> e <code>subqtde_active</code>: subcategorias de todos os níveis abaixo (todas e só as publicadas).</li>
    <li><code>parent_id_path</code>: em uma subcategoria, os ids das categorias acima, do primeiro nível até a mãe, separados por vírgula. No primeiro nível, <code>null</code>.</li>
    <li><code>friendly_url_path</code>: em uma subcategoria, o caminho de URLs amigáveis desde o primeiro nível (<code>pizzas/pizzas-doces</code>). No primeiro nível, <code>null</code>.</li>
  </ul>

  <p>Para uma categoria só, use <a href="./Categoria%20Detalhe.yml">Categoria Detalhe</a>.</p>
