info:
  name: Categoria Listagem
  type: http
  seq: 1
  tags:
    - Categorias

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/categoria/"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: parent_id
      value: "12"
      type: query
      description: "Integer - Opcional - Id da categoria mãe: lista só as filhas diretas dela, cada uma com as próprias subcategorias. Sem ele, lista as categorias do primeiro nível."
      disabled: true
    - name: lastupdate_gte
      value: 2026-07-01
      type: query
      description: Date - Opcional - Alteradas a partir desta data/hora (lastupdate >= valor). Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: lastupdate_lte
      value: 2026-07-31 23:59:59
      type: query
      description: Date - Opcional - Alteradas até esta data/hora (lastupdate <= valor). Data sem hora vale como 00:00:00. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: created_gte
      value: 2026-06-01
      type: query
      description: Date - Opcional - Criadas a partir desta data/hora (created >= valor). Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: created_lte
      value: 2026-06-18
      type: query
      description: Date - Opcional - Criadas até esta data/hora (created <= valor). Data sem hora vale como 00:00:00. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

