info:
  name: Categoria Detalhe
  type: http
  seq: 2
  tags:
    - Categorias

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/categoria/:categoriaId/"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: categoriaId
      value: "{{categoriaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"categorias":{"categoria":{"id":"2","site_id":"5095","parent_id":"0","parent_id_path":null,"name":"Milkshakes","friendly_url":"milkshakes","friendly_url_path":null,"icon":null,"image":null,"description":null,"google_category":null,"cashback_multiplier":null,"result_order":null,"count":"0","priority":"2","prodqtde":"3","prodqtde_active":"3","subqtde":"0","subqtde_active":"0","published":"Y","created":"2026-06-18 14:07:10","lastupdate":"2026-06-18 14:07:10"}}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Categoria n\u00e3o informada, ou atributo \"id\" faltando."}'
