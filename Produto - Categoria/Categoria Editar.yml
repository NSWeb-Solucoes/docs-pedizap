info:
  name: Categoria Editar
  type: http
  seq: 4
  tags:
    - Categorias

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/categoria/:categoriaId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: categoriaId
      value: "{{categoriaId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: name
        value: AOBA
        description: Nome da categoria
      - name: published
        value: ""
        description: '"Y" ou "N"'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da categoria
          - name: published
            value: ""
            description: '"Y" ou "N"'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success"}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da categoria
          - name: published
            value: ""
            description: '"Y" ou "N"'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/categoria/:categoriaId"
      method: PUT
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaId
          value: "{{categoriaId}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da categoria
          - name: published
            value: ""
            description: '"Y" ou "N"'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Categoria n\u00e3o informada, ou atributo \"id\" faltando."}'
