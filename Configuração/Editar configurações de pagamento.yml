info:
  name: Editar configurações de pagamento
  type: http
  seq: 5
  tags:
    - Configurações

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/conf/pagamento"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: form-urlencoded
    data:
      - name: pagamento_metodos[]
        value: ""
        description: Metodo de pagamento a habilitar/desabilitar na loja; envie um campo pagamento_metodos[] por metodo (veja valores possiveis nos docs abaixo)
        disabled: true
      - name: pagtoentrega_metodos[]
        value: ""
        description: Forma aceita no pagamento feito na entrega (dinheiro, credito, debito, vale ou pix); requer pagtoentrega habilitado em pagamento_metodos
        disabled: true
      - name: pagtoentrega_bandeiras_credito[]
        value: ""
        description: Bandeira de cartao de credito aceita no pagamento na entrega (texto livre, uma por campo)
        disabled: true
      - name: pagtoentrega_bandeiras_debito[]
        value: ""
        description: Bandeira de cartao de debito aceita no pagamento na entrega (texto livre, uma por campo)
        disabled: true
      - name: pagtoentrega_bandeiras_vale[]
        value: ""
        description: Bandeira de vale (refeicao/alimentacao) aceita no pagamento na entrega (texto livre, uma por campo)
        disabled: true
      - name: config_PIX_CHAVE
        value: ""
        description: Chave PIX usada para recebimento via deposito/transferencia
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

