info:
  name: Tabela de métodos de pagamento
  type: http
  seq: 4
  tags:
    - OAuth

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/conf/ordermethods"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/conf/ordermethods"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"pagseguro":"Pagseguro","pix":"PIX QRCode","mercadopago":"MercadoPago","paypal":"PayPal","deposito":"Transfer\u00eancia\/Dep\u00f3sito","pagtoentrega":"Pagar ao Receber","pagtoifood":"Pagar ao Receber (Parceiro)","boleto":"Boleto Banc\u00e1rio","cartao":"Cart\u00e3o de Cr\u00e9dito","custom":"Personalizado"}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/conf/ordermethods"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
