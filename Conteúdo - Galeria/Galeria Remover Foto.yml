info:
  name: Galeria Remover Foto
  type: http
  seq: 7
  tags:
    - Conteúdos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/content/:conteudoId/fotos/:fotoId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: conteudoId
      value: "{{conteudoId}}"
      type: path
    - name: fotoId
      value: "{{fotoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/content/:conteudoId/fotos/:fotoId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoId
          value: "{{conteudoId}}"
          type: path
        - name: fotoId
          value: "{{fotoId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      headers: []
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/content/:conteudoId/fotos/:fotoId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoId
          value: "{{conteudoId}}"
          type: path
        - name: fotoId
          value: "{{fotoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/content/:conteudoId/fotos/:fotoId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoId
          value: "{{conteudoId}}"
          type: path
        - name: fotoId
          value: "{{fotoId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Foto n\u00e3o informada ou n\u00e3o encontrada neste conte\u00fado."}'

docs: |-
  <p>Remove o registro e o arquivo físico da foto.</p>
