info:
  name: Campos Extras Listagem
  type: http
  seq: 1
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content/extrafields"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: category_id
      value: '121'
      type: query
      description: 'Id da categoria. Sem esse filtro retorna todos os campos do site'
      disabled: true
    - name: template_name
      value: ''
      type: query
      description: 'Filtra os campos de um template especifico (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/content/extrafields"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: category_id
          value: '121'
          type: query
          description: 'Id da categoria. Sem esse filtro retorna todos os campos do site'
          disabled: true
        - name: template_name
          value: ''
          type: query
          description: 'Filtra os campos de um template especifico (opcional)'
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"extrafields":{"extrafield":[{"id":"6","site_id":"109","category_id":"121,348,349","template_name":"","key":"mcheck","title":"MultiCheck Teste","type":"multiCheckbox","options":"Teste 1,Teste 2","values":"teste1,teste2","description":"","priority":null,"navigation":"Y","metadata":""},{"id":"4","site_id":"109","category_id":"121","template_name":"","key":"filtro_teste","title":"Filtro Teste","type":"text","options":null,"values":null,"description":"","priority":"0","navigation":"Y","metadata":null}]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/content/extrafields"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: category_id
          value: '121'
          type: query
          description: 'Id da categoria. Sem esse filtro retorna todos os campos do site'
          disabled: true
        - name: template_name
          value: ''
          type: query
          description: 'Filtra os campos de um template especifico (opcional)'
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: |-
  <p>Lista a definição dos campos extras (extrafields) de conteúdo, para saber quais chaves podem ser enviadas
  na inclusão e na edição de um conteúdo.</p>

  <p>O campo <code>key</code> é o nome que deve ser usado no corpo da requisição de
  <code>/api/content</code>. O <code>type</code> indica o tipo do campo
  (<code>text</code>, <code>textarea</code>, <code>html</code>, <code>select</code>,
  <code>multiCheckbox</code>, <code>filelink</code>, <code>imagelink</code>, <code>date</code>,
  <code>money</code>, entre outros); campos do tipo <code>multi*</code> aceitam vários valores separados por
  vírgula.</p>
