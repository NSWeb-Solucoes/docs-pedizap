info:
  name: Galeria Inserir Foto por HTTP Upload
  type: http
  seq: 4
  tags:
    - Produtos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos/"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: description
        type: text
        value: ""
        description: Legenda/descricao da foto (opcional)
      - name: photo_file
        type: text
        value: ""
        description: Arquivo de imagem enviado via upload multipart
      - name: featured
        type: text
        value: ""
        description: '"S"/"N" (default "N") - marca a foto como a principal/destaque do produto'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

