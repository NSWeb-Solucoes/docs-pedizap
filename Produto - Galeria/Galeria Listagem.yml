info:
  name: Galeria Listagem
  type: http
  seq: 1
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"photos":{"photo":[{"id":"5","site_id":"5095","product_id":"6","description":null,"file_name":"photo_66a3425bdb1c5e.jpg","file_name_import":null,"featured":"Y","published":"Y","priority":"1"}]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Produto n\u00e3o informado, n\u00e3o encontrado ou atributo \"produto\" faltando."}'

docs: |-
  <p>  Para a listagem das fotos o caminho ˜fotos˜ deve ser adicionado ao final do código do produto </p>

  <p> Por exemplo: <code> http://url/api/produto/900/fotos </code> </p>
