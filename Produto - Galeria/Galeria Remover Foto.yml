info:
  name: Galeria Remover Foto
  type: http
  seq: 6
  tags:
    - Produtos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos/"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
    - name: id
      value: ""
      type: query
      description: Obrigatorio - id da foto a ser removida (nao confundir com produtoId)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos/"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
        - name: id
          value: ""
          type: query
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos/"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
        - name: id
          value: ""
          type: query
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos/"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: produtoId
          value: "{{produtoId}}"
          type: path
        - name: id
          value: ""
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""

docs: |-
  <p>O parâmetro <code>id</code> (id da foto, não confundir com <code>produtoId</code>) é obrigatório — sem ele a API retorna erro "ID da foto não informado.".</p>
