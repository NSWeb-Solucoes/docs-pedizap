info:
  name: Galeria Inserir Foto por URL
  type: http
  seq: 5
  tags:
    - Produtos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: produtoId
      value: "{{produtoId}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: description
        type: text
        value: ""
        description: Legenda/descricao da foto (opcional)
      - name: photo_url
        type: text
        value: ""
        description: URL publica de uma imagem para o servidor baixar e associar ao produto
      - name: featured
        type: text
        value: ""
        description: '"S"/"N" (default "N") - marca a foto como a principal/destaque do produto'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{proto}}://{{domain}}/api/produto/:produtoId/fotos"
