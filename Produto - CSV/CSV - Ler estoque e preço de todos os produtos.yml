docs: |-
  <p>Retorna uma string CSV contendo as colunas code;price;price_promo;estoque_quantidade.</p>

  <p>Este mesmo layout poderá ser submitado via POST neste mesmo método para atualizar os dados em lote.</p>

  <p>Todos os produtos devem estar com o campo Código/SKU corretamente preenchido.</p>

  <p>Parâmetro opcional <code>pricetable_id</code> (query string) filtra o export pelos preços de uma tabela de preço específica em vez do preço padrão do produto.</p>
