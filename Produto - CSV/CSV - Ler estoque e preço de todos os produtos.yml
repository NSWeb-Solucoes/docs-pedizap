info:
  name: CSV - Ler estoque e preço de todos os produtos
  type: http
  seq: 1
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/produto/csv"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: pricetable_id
      value: ""
      type: query
      description: Optional - filtra o export por uma tabela de preço específica
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

