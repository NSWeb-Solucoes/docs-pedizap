info:
  name: CSV - Atualizar estoque e preço em lote
  type: http
  seq: 2
  tags:
    - Produtos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/produto/csv"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: multipart-form
    data:
      - name: csvdata
        type: text
        value: |-
          "code";"price";"price_promo";"estoque_quantidade"
          "00000000000000000010";"124";"123";"32"
        description: 'String CSV (separador ";"), 1a linha com o cabecalho das colunas a atualizar: code (obrigatoria) e opcionalmente price, price_promo, estoque_quantidade'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/produto/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: ""
            description: 'String CSV (separador ";"), 1a linha com o cabecalho das colunas a atualizar: code (obrigatoria) e opcionalmente price, price_promo, estoque_quantidade'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","affectedRows":0}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/produto/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: ""
            description: 'String CSV (separador ";"), 1a linha com o cabecalho das colunas a atualizar: code (obrigatoria) e opcionalmente price, price_promo, estoque_quantidade'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: |-
  <p>Processa uma string CSV contendo as colunas code;price;price_promo;estoque_quantidade.</p>

  <p>As colunas a serem atualizadas devem estar explicitas na primeira linha do parâmetro csvdata, sendo a coluna "code" obrigatória e as demais opcionais.</p>

  <p>Segue abaixo um exemplo visual:</p>

  <p>"code";"price";"price_promo";"estoque_quantidade"<br><br>"cod-9709";"52.03426139";"41.62740911";"28"<br><br>"cod-9710";"119.9868749";"95.98949996";"0"<br><br>"cod-9707";"45.57723352";"36.46178682";"9"</p>

  - Request
      
      ```
          + Headers
              Authorization: 9a30756ac29ea18ba50fc27a02af463d
              Accept: text/json
              Content-type:application/x-www-form-urlencoded
      
       ```
