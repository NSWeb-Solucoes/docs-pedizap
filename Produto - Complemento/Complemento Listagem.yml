info:
  name: Complemento Listagem
  type: http
  seq: 1
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/complemento/categoria?name=Escolha sua Bor&sku=&min=0&max=1&required=Y&rule=price_higher&returnLayout=new,items"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: name
      value: Escolha sua Bor
      type: query
      description: String - Optional - Nome do grupo de complementos (atencao, o parametro e "name", nao "nome")
    - name: sku
      value: ""
      type: query
      description: String - Optional - Filtra por code (SKU) exato da categoria
    - name: min
      value: "0"
      type: query
      description: Integer - Optional - Grupos com mínimo de itens maior ou igual a este (grupo.min >= min). 0 não filtra.
    - name: max
      value: "1"
      type: query
      description: Integer - Optional - Maximo de items a serem escolhidos (grupo.max <= max)
    - name: required
      value: Y
      type: query
      description: Enum('Y', 'N') - Optional - É obrigatório a escolha de items
    - name: rule
      value: price_higher
      type: query
      description: Enum('price_higher') - Optional - Usar regra adicional no valor dos items. Disponivel apenas 'price_higher', para usar em pizzas meia
    - name: returnLayout
      value: new,items
      type: query
      description: "String - Opcional - Formato do grupo, separado por vírgula. Padrão `items`: grupo com os itens, sem ids, com `required` e `published` booleanos e o SKU do grupo em `ref`. Com `new`, o grupo vem com todos os campos gravados (`id`, `code`, `priority`...), e com `new,items` também os itens."
    - name: result_order
      value: category
      type: query
      description: String - Opcional - Coluna da ordenação (padrão `id`). Com `code`, ordena o SKU como número.
      disabled: true
    - name: reverte_order
      value: "1"
      type: query
      description: Boolean - Opcional - Com 1, inverte a ordenação (decrescente).
      disabled: true
    - name: limit
      value: "50"
      type: query
      description: Integer - Opcional - Grupos por página (padrão 200).
      disabled: true
    - name: page
      value: "2"
      type: query
      description: Integer - Opcional - Página da busca (padrão 1).
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

