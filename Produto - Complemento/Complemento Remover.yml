info:
  name: Complemento Remover
  type: http
  seq: 5
  tags:
    - Produtos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/complemento/categoria"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: json
    data: |-
      {
        "reference_id": "74545"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: |-
          {
            "reference_id": "74545"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: |-
          {
            "reference_id": "74545"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Referência não informada
    description: O corpo precisa ter a referência do grupo em `reference_id`.
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: "{}"
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Referência da categoria é obrigatória"}'
  - name: 422 Grupo não encontrado
    description: Não existe grupo com essa referência. Este erro volta sem corpo.
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: |-
          {
            "reference_id": "99999"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""

docs: |-
  <p>Remove o grupo de complementos e todos os itens dele. Informe a referência do grupo em <code>reference_id</code>, no corpo JSON.</p>

  <p>A resposta é <code>204</code>, sem corpo. Sem <code>reference_id</code>, a API responde <code>422</code> com a mensagem do erro; se o grupo não existir, responde <code>422</code> sem corpo.</p>
