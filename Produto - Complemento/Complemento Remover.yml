info:
  name: Complemento Remover
  type: http
  seq: 5
  tags:
    - Produtos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/complemento/categoria"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: json
    data: |-
      {
        "reference_id": "74545"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: |-
          {
            "reference_id": "74545"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: json
        data: |-
          {
            "reference_id": "74545"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
