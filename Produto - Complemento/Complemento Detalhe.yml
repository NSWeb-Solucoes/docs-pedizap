info:
  name: Complemento Detalhe
  type: http
  seq: 2
  tags:
    - Produtos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/complemento/categoria/:categoriaRef"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: categoriaRef
      value: "{{categoryRef}}"
      type: path
    - name: returnLayout
      value: new,items
      type: query
      description: "String - Opcional - Formato do grupo, separado por vírgula. Padrão `items`: grupo com os itens, sem ids, com `required` e `published` booleanos e o SKU do grupo em `ref`. Com `new`, o grupo vem com todos os campos gravados (`id`, `code`, `priority`...), e com `new,items` também os itens."
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Grupo encontrado
    description: Sem `returnLayout`, o grupo vem com os itens em `items`, sem ids, com `required` e `published` booleanos e o SKU do grupo em `ref`.
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria/:categoriaRef"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaRef
          value: "{{categoryRef}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","grupo":{"category":"Que tal um Adicional para deixar seu pedido ainda melhor?","reference_id":"7590","min":"0","max":"4","rule":"","required":false,"items":[{"name":"Adicionar Calabresa","code":"456789","desc":"","price":"6","image":"","published":true,"limitFree":0},{"name":"Adicionar Hamburguer","code":"12356","desc":"","price":"8.5","image":"","published":true,"limitFree":0}],"ref":"adw"}}'
  - name: 200 Grupo com todos os campos
    description: "`returnLayout=new,items` traz o grupo e os itens com todos os campos gravados, como na listagem."
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria/:categoriaRef"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaRef
          value: "{{categoryRef}}"
          type: path
        - name: returnLayout
          value: new,items
          type: query
          description: "String - Opcional - Formato do grupo, separado por vírgula. Padrão `items`: grupo com os itens, sem ids, com `required` e `published` booleanos e o SKU do grupo em `ref`. Com `new`, o grupo vem com todos os campos gravados (`id`, `code`, `priority`...), e com `new,items` também os itens."
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","grupo":{"id":"12","site_id":"5095","category":"Que tal um Adicional para deixar seu pedido ainda melhor?","reference_id":"7590","code":"adw","min":"0","max":"4","rule":"","required":"0","priority":"0","items":[{"id":"31","site_id":"5095","extras_category_id":"12","name":"Adicionar Calabresa","code":"456789","desc":"","price":"6","limit_free":"0","image":"","published":"1","priority":"0"},{"id":"32","site_id":"5095","extras_category_id":"12","name":"Adicionar Hamburguer","code":"12356","desc":"","price":"8.5","limit_free":"0","image":"","published":"1","priority":"1"}]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria/:categoriaRef"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaRef
          value: "{{categoryRef}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Grupo não encontrado
    description: Não existe grupo de complementos com essa referência (`reference_id`).
    request:
      url: "{{proto}}://{{domain}}/api/complemento/categoria/:categoriaRef"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: categoriaRef
          value: "{{categoryRef}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Categoria n\u00e3o encontrada"}'
