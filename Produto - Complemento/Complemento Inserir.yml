docs: |-
  **Importante!!** A lista de items é SUBSTITUIDA pela lista enviada no corpo da requisição, NÃO é feito uma JUNÇÃO da atual no sistema com a enviada no corpo.

  Diferente do endpoint POST do produto, não é necessario informar todos os campos para fazer a edição. Só informar o ref e os campos a serem editados.

  O único campo obrigatório é **category** (nome do grupo de complementos).

  <p><strong>Esse POST funciona como upsert:</strong> se o <code>ref</code>/<code>reference_id</code> enviado já corresponder a uma categoria existente, ela é <strong>atualizada</strong> em vez de criar uma nova (mesmo comportamento de <a href="./Complemento%20Editar.yml">Complemento Editar</a>, via PUT).</p>

  <p>É possível enviar <code>ref</code> no lugar de <code>code</code> — o servidor trata os dois como o mesmo campo internamente (<code>ref</code> é apenas um alias mais amigável de <code>code</code>).</p>

  Nos cassos de edição, também é possível passar o ref na propria URL:
  /api/complemento/categoria/ref/:reference_id

  <p>Também aceita <code>priority</code> (ordem de exibição do grupo) e, em cada item de <code>items</code>, <code>limit_free</code> (quantidade grátis do item, default 0).</p>
