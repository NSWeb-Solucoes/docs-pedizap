docs: |-
  **Importante!!** A lista de items é SUBSTITUIDA pela lista enviada no corpo da requisição, NÃO é feito uma JUNÇÃO da atual no sistema com a enviada no corpo.

  A categoria a ser editada é identificada por <code>ref</code> ou <code>reference_id</code> (query ou body) — obrigatório para o PUT (sem isso a API retorna "Referência da categoria é obrigatória").

  <p>É possível enviar <code>ref</code> no lugar de <code>code</code> — o servidor trata os dois como o mesmo campo internamente.</p>

  Você também pode passar o ref na propria URL:
  /api/complemento/categoria/ref/:reference_id

  <p>Também aceita <code>priority</code> (ordem de exibição do grupo) e, em cada item de <code>items</code>, <code>limit_free</code> (quantidade grátis do item, default 0).</p>
