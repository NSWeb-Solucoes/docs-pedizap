info:
  name: Complemento CSV - Atualizar preço em lote
  type: http
  seq: 2
  tags:
    - Produtos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/complemento/csv"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: multipart-form
    data:
      - name: csvdata
        type: text
        value: "\"code\";\"price\"

          \"456789\";\"6.00\"

          \"12356\";\"8.50\""
        description: 'String CSV (separador ";"), 1a linha com o cabecalho: code e price (ambas obrigatorias)'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Preços atualizados
    description: Cada `code` atualiza o preço de todos os itens de complemento com esse SKU. `affectedRows` vem sempre 0 neste endpoint, mesmo quando os preços mudam.
    request:
      url: "{{proto}}://{{domain}}/api/complemento/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: |-
              "code";"price"
              "456789";"6.00"
              "12356";"8.50"
            description: 'String CSV (separador ";"), 1a linha com o cabecalho: code e price (ambas obrigatorias)'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","affectedRows":0}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/complemento/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: |-
              "code";"price"
              "456789";"6.00"
              "12356";"8.50"
            description: 'String CSV (separador ";"), 1a linha com o cabecalho: code e price (ambas obrigatorias)'
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autenticação inválida."}'
  - name: 422 Coluna não permitida
    description: O cabeçalho só aceita `code` e `price`.
    request:
      url: "{{proto}}://{{domain}}/api/complemento/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: |-
              "code";"price";"price_promo"
              "456789";"6.00";"5.00"
            description: 'String CSV (separador ";"), 1a linha com o cabecalho: code e price (ambas obrigatorias)'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Campo price_promo não é válido ou permitido."}'
  - name: 422 Sem a coluna price
    description: "`code` e `price` são obrigatórios no cabeçalho."
    request:
      url: "{{proto}}://{{domain}}/api/complemento/csv"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: multipart-form
        data:
          - name: csvdata
            type: text
            value: |-
              "code"
              "456789"
            description: 'String CSV (separador ";"), 1a linha com o cabecalho: code e price (ambas obrigatorias)'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Campo price não informado."}'

docs: |-
  <p>Processa uma string CSV (parâmetro <code>csvdata</code>, separador <code>;</code>) contendo as colunas <code>code;price</code> pra atualizar em lote o preço de itens de complemento (<code>product_extras_item</code>).</p>

  <p>As colunas devem estar explícitas na primeira linha; <strong>code é obrigatório</strong> e <strong>price também</strong> (diferente do CSV de produto, aqui os dois são exigidos — sem <code>price</code> a requisição retorna erro).</p>

  <p>Exemplo:</p>

  <p>"code";"price"<br>"456789";"12.00"<br>"12356";"8.50"</p>

  <p>Endpoint irmão de <a href="../Produto%20-%20CSV/CSV%20-%20Atualizar%20estoque%20e%20preço%20em%20lote.yml">CSV - Atualizar estoque e preço em lote</a> (produto), mas só aceita <code>code</code>/<code>price</code> — não tem <code>estoque_quantidade</code> nem <code>price_promo</code>.</p>
