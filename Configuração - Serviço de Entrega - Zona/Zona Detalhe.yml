info:
  name: Zona Detalhe
  type: http
  seq: 2
  tags:
    - Entrega

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
    - name: zonaId
      value: "{{zonaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: zonaId
          value: "{{zonaId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: server
          value: nginx/1.14.1
        - name: date
          value: Wed, 29 Jul 2026 14:05:48 GMT
        - name: content-type
          value: application/json
        - name: transfer-encoding
          value: chunked
        - name: connection
          value: keep-alive
        - name: vary
          value: Accept-Encoding
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: SAMEORIGIN
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-allow-headers
