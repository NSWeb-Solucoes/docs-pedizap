info:
  name: Zona Remover
  type: http
  seq: 5
  tags:
    - Entrega

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
    - name: zonaId
      value: "{{zonaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: zonaId
          value: "{{zonaId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      headers:
        - name: server
          value: nginx/1.14.1
        - name: date
          value: Wed, 29 Jul 2026 14:09:29 GMT
        - name: content-type
          value: text/html; charset=ISO-8859-1
        - name: connection
          value: keep-alive
        - name: x-xss-protection
          value: 1; mode=block
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: SAMEORIGIN
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-allow-headers
          value: Content-Type, Authorization, X-ApiRequest, X-ApiSession,Cache-Control
        - name: access-control-allow-methods
          value: POST, GET, PUT, DELETE, OPTIONS
        - name: access-control-max-age
          value: "1785348569"
        - name: strict-transport-security
          value: max-age=31536000; includeSubDomains
      body:
        type: html
        data: ""
  - name: 401 Response
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: zonaId
          value: "{{zonaId}}"
          type: path
