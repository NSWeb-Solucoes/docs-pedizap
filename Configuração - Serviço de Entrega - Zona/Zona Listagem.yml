docs: |-
  <p>Zona de entrega, sempre aninhada em um serviço (<code>servico_id</code> vem da URL). Os campos obrigatórios variam conforme o <code>zona_tipo</code> do serviço pai:</p>

  <ul>
  <li><code>cep</code>: <code>cep_ini</code> e <code>cep_fim</code> (faixa de CEP).</li>
  <li><code>km</code> / <code>polygon</code>: <code>km</code> (distância até onde a zona atende).</li>
  <li><code>bairro</code>: <code>bairro_id</code> (id do bairro na base de CEPs).</li>
  <li><code>bairro_custom</code>: <code>cidade_id</code> e <code>uf</code> (2 letras); zonas duplicadas (mesmo serviço + cidade + bairro) não geram uma nova zona, retornam a já existente.</li>
  </ul>

  <p>Quando <code>valor_fixo="N"</code>, o frete é calculado por uma tabela de peso em vez do campo <code>valor</code>. Envie a chave <code>valores</code> como um array de objetos <code>{"peso": ..., "valor": ...}</code> para substituir por completo a tabela de peso da zona (mandar um array vazio limpa a tabela; não enviar a chave preserva a tabela atual).</p>

  <p><code>peso</code> e <code>valor</code> são obrigatórios em cada item de <code>valores</code>. Se qualquer item for inválido, a troca inteira é cancelada (a tabela antiga é preservada) e a resposta é 422 com o erro específico do item em <code>msg</code>.</p>
