      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

