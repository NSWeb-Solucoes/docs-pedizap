info:
  name: Zona Editar
  type: http
  seq: 4
  tags:
    - Entrega

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/:zonaId"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
    - name: zonaId
      value: "{{zonaId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: km
        value: ""
        description: Distancia limite (KM) desta faixa de zona, usado quando zona_tipo = km
        disabled: true
      - name: nome
        value: Ola MEUS AMIGOS
        description: Nome da zona
      - name: valor_fixo
        value: ""
        description: '"S" cobra o valor fixo do campo valor; "N" usa a tabela de peso da zona (endpoint de Zona Valor)'
      - name: valor
        value: ""
        description: Valor do frete cobrado nesta zona, usado quando valor_fixo = "S"
        disabled: true
      - name: prazo_qtde
        value: ""
        description: Quantidade do prazo de entrega
        disabled: true
      - name: prazo_unidade
        value: ""
        description: Unidade de tempo do prazo (segundo, minuto, hora ou dia)
        disabled: true
      - name: frete_gratis
        value: ""
        description: '"S" ou "N" - ativa frete gratis para esta zona'
        disabled: true
      - name: frete_gratis_minimo
        value: ""
        description: Valor minimo de compra para o frete gratis ser aplicado
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

