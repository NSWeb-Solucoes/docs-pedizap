info:
  name: Zona Bairro Customizado Inserir
  type: http
  seq: 7
  tags:
    - Entrega

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/bairrocustom"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: nome
        type: text
        value: |-
          Centro
          Vila São Paulo
        description: Um bairro por linha; cada linha vira uma zona bairro_custom.
      - name: cidade_id
        type: text
        value: "439"
        description: ID da cidade (Model_Cidade) a qual o(s) bairro(s) customizado(s) pertence(m)
      - name: uf
        type: text
        value: SP
        description: Sigla do estado (UF) da cidade
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

