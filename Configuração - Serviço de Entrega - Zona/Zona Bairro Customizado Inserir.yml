docs: |-
  <p>Cria uma ou mais zonas do tipo bairro_custom a partir de nomes digitados livremente (um por linha em <code>nome</code>). Só faz sentido para serviços com <code>zona_tipo=bairro_custom</code>.</p>

  <p>Bairro duplicado (mesmo serviço + <code>cidade_id</code> + nome do bairro) não gera zona nova; a existente é reaproveitada silenciosamente.</p>

  <p>Equivalente REST de <code>Class_EntregaZona::addBairroCustom</code> / <code>Model_Entrega_BairroCustom::addBairro</code>. Resposta sempre <code>{"status": "success", "bairros": [...]}</code> (201), mesmo que algum nome individual tenha sido rejeitado — bairros inválidos são descartados silenciosamente da lista de retorno (mesmo comportamento do CMS).</p>
