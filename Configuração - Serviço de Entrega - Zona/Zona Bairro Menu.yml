docs: |-
  <p>Lookup de cidades/bairros para descobrir <code>bairro_id</code> (zona_tipo=bairro) ou os bairros já cadastrados (zona_tipo=bairro_custom) antes de criar uma zona.</p>

  <ul>
  <li>Só <code>uf</code>: retorna <code>{"status": "success", "return": {"cidades": [...]}}</code> — lista de cidades da UF.</li>
  <li><code>uf</code> e <code>cidade</code> (id da cidade): retorna também <code>bairros</code> — para zona_tipo=bairro, os bairros do catálogo (<code>Model_Cep_Bairro</code>) com <code>bairro_id</code>; para zona_tipo=bairro_custom, as zonas bairro_custom já cadastradas nesse serviço/cidade.</li>
  <li>Sem <code>uf</code>: 400 com <code>{"status": "error", "message": "..."}</code>.</li>
  </ul>

  <p>Equivalente REST de <code>Class_EntregaZona::bairroMenu</code>.</p>
