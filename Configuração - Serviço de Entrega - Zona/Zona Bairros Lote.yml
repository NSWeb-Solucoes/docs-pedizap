info:
  name: Zona Bairros Lote
  type: http
  seq: 6
  tags:
    - Entrega

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/zona/bairros"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "bairros": [
          {
            "bairro_id": 123,
            "nome": "Centro",
            "prazo_unidade": "minuto",
            "prazo_qtde": 60,
            "frete_gratis": "N",
            "frete_gratis_minimo": 0,
            "valor": 8
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

