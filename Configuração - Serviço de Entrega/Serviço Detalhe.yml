              "polygoncenter": null,
              "peso_min": "0",
              "peso_max": "50",
              "aceita_volumosos": "S",
              "comprimento_max": "0",
              "largura_max": "0",
              "altura_max": "0",
              "soma_max": "0",
              "ativo": "N",
              "calcular_cubagem": "N",
              "fator_cubagem": "0",
              "seguro": "N",
              "seguro_acrescimo": "50",
              "agendamento": "N",
              "agendamento_diasexibidos": "0",
              "agendamento_maxdia": "0",
              "agendamento_maxperiodo": "0",
              "cep_exclusao": null
            }
          }
  - name: 401 Response
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
    response:
