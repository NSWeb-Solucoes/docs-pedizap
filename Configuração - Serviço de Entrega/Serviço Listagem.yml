docs: |-
  <p>Serviços de entrega/retirada. O campo <code>zona_tipo</code> define como as zonas (sub-recurso <code>/zona</code>) desse serviço calculam o frete: <code>cep</code> (faixa de CEP), <code>km</code> (distância), <code>bairro</code> (bairro cadastrado na base de CEPs), <code>bairro_custom</code> (bairro cadastrado manualmente) ou <code>polygon</code> (área de geolocalização).</p>

  <p><code>zona_tipo</code> não pode ser alterado por PUT depois que o serviço já tiver zonas cadastradas.</p>

  <p>Os campos <code>polygonatendida</code>, <code>polygonsuspensa</code> e <code>polygoncenter</code> (GeoJSON/array de coordenadas) só se aplicam a zona_tipo="polygon" e não fazem parte do formulário padrão acima; consulte o suporte para o formato aceito antes de enviá-los.</p>

  <p><code>cep_exclusao</code>: uma faixa/CEP por linha. Cada linha é um CEP único (<code>NNNNN-NNN</code> ou <code>NNNNNNNN</code>) ou uma faixa <code>cepInicial|cepFinal</code> (nesse caso <code>cepInicial</code> precisa ser menor que <code>cepFinal</code>). Linha inválida retorna 422 com <code>errorlist.cep_exclusao</code> listando o número da linha e o motivo.</p>

  <p>Criar ou editar um serviço (POST/PUT) sincroniza automaticamente a configuração de frete da loja: se <code>lojaConfig.frete</code> não estiver como <code>frete_calculado</code> ou <code>frete_metodos</code> não incluir <code>custom</code>, ambos são ajustados e salvos — do contrário o serviço fica configurado mas invisível no checkout. Isso acontece em toda gravação, não só quando <code>ativo</code> muda.</p>
