docs: |-
  <p>Não é necessário reenviar todos os campos — os que não forem informados são mantidos como estão.</p>

  <p>Ao alterar a <code>friendly_url</code>, o <code>link_destino</code> do registro de SEO da categoria é
  atualizado automaticamente.</p>
