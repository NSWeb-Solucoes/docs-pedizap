docs: |-
  <p>Os únicos campos obrigatórios são <strong>name</strong> e <strong>parent_id</strong>
  (use <code>0</code> para categoria raiz).</p>

  <p>Quando <code>friendly_url</code> não é informada, ela é gerada automaticamente a partir do nome.
  A url amigável precisa ser única no site — se já existir, a resposta é 422 com
  <code>errorlist.friendly_url</code>.</p>
