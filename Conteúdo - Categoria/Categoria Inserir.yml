info:
  name: Categoria Inserir
  type: http
  seq: 4
  tags:
    - Conteúdos

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/content/categorias"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  body:
    type: form-urlencoded
    data:
      - name: name
        value: 'Nova categoria'
        description: 'Nome da categoria (obrigatorio, ate 100 caracteres)'
      - name: parent_id
        value: '0'
        description: 'Id da categoria pai, 0 para raiz (obrigatorio)'
      - name: friendly_url
        value: ''
        description: 'Url amigavel unica. Se nao informada e gerada a partir do nome'
      - name: description
        value: ''
        description: 'Descricao da categoria (opcional)'
      - name: image
        value: ''
        description: 'Caminho da imagem na galeria de midia (opcional)'
      - name: icon
        value: ''
        description: 'Caminho do icone na galeria de midia (opcional)'
      - name: result_order
        value: ''
        description: 'Ordenacao dos conteudos da categoria, ex: "date DESC" (opcional)'
      - name: count
        value: '0'
        description: 'Quantidade de conteudos por pagina (opcional)'
      - name: priority
        value: '1'
        description: 'Posicao de 1 a 49 (opcional)'
      - name: published
        value: 'Y'
        description: '"Y"/"N" (default "Y") - publica a categoria'
      - name: show_date
        value: 'N'
        description: '"Y"/"N" - exibe a data dos conteudos'
      - name: template_name
        value: ''
        description: 'Template da categoria (opcional)'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

