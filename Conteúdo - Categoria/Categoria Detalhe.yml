info:
  name: Categoria Detalhe
  type: http
  seq: 3
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: conteudoCategoriaId
      value: "{{conteudoCategoriaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"categorias":{"categoria":[{"id":"361","site_id":"109","parent_id":"0","template_name":"","name":"Categoria API Teste","friendly_url":"categoria-api-teste","icon":"","image":"","description":"","result_order":"","count":"0","priority":"1","show_date":"N","published":"Y","link":"https:\/\/loja.com.br\/site\/conteudo\/categoria-api-teste"}]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Categoria n\u00e3o informada, n\u00e3o encontrada ou atributo \"id\" faltando."}'
