info:
  name: Categoria Listagem
  type: http
  seq: 1
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content/categorias"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: parent_id
      value: '0'
      type: query
      description: 'Filtra apenas as categorias filhas do id informado (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: parent_id
          value: '0'
          type: query
          description: 'Filtra apenas as categorias filhas do id informado (opcional)'
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"totalRegistros":1,"categorias":{"categoria":[{"id":"361","site_id":"109","parent_id":"0","template_name":"","name":"Categoria API Teste","friendly_url":"categoria-api-teste","icon":"","image":"","description":"","result_order":"","count":"0","priority":"1","show_date":"N","published":"Y","link":"https:\/\/loja.com.br\/site\/conteudo\/categoria-api-teste"}]}}'
