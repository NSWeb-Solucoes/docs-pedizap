info:
  name: Categoria Subcategorias
  type: http
  seq: 2
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content/category"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: category
      value: ''
      type: query
      description: 'Id da categoria pai (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/content/category"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: category
          value: ''
          type: query
          description: 'Id da categoria pai (opcional)'
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '[{"id":"121","site_id":"109","parent_id":"0","template_name":"default","name":"Empresa","friendly_url":"empresa","icon":"","image":"","description":"","result_order":"title ASC","count":"1","priority":"1","show_date":"Y","published":"Y","categories":[{"id":"348","site_id":"109","parent_id":"121","name":"Empresa 2","friendly_url":"empresa-2","published":"Y"}]}]'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/content/category"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: category
          value: ''
          type: query
          description: 'Id da categoria pai (opcional)'
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: |-
  <p>Endpoint de leitura das subcategorias publicadas, usado pelas listagens do site.</p>
