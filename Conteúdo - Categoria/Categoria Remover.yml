info:
  name: Categoria Remover
  type: http
  seq: 6
  tags:
    - Conteúdos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: conteudoCategoriaId
      value: "{{conteudoCategoriaId}}"
      type: path
    - name: childs
      value: 'Y'
      type: query
      description: 'Informe "Y" para remover tambem as categorias filhas'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
        - name: childs
          value: 'Y'
          type: query
          description: 'Informe "Y" para remover tambem as categorias filhas'
          disabled: true
    response:
      status: 204
      statusText: No Content
      headers: []
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
        - name: childs
          value: 'Y'
          type: query
          description: 'Informe "Y" para remover tambem as categorias filhas'
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/content/categorias/:conteudoCategoriaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: conteudoCategoriaId
          value: "{{conteudoCategoriaId}}"
          type: path
        - name: childs
          value: 'Y'
          type: query
          description: 'Informe "Y" para remover tambem as categorias filhas'
          disabled: true
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Categoria n\u00e3o informada, n\u00e3o encontrada ou atributo \"id\" faltando."}'

docs: |-
  <p>Os conteúdos da categoria <strong>não</strong> são removidos — eles ficam sem categoria
  (<code>category_id = 0</code>).</p>

  <p>Com <code>?childs=Y</code> as categorias filhas também são removidas.</p>
