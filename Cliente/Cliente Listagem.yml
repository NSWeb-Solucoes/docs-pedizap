info:
  name: Cliente Listagem
  type: http
  seq: 1
  tags:
    - Clientes

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/cliente"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: filter_tipo
      value: "1"
      type: query
      description: Filtrando o ID do tipo de cadastro
      disabled: true
    - name: q
      value: ""
      type: query
      description: Pesquisa textual nos dados do cliente.
      disabled: true
    - name: alfa
      value: r
      type: query
      description: "Primeira letra do nome a ser pesquisado. Ex: a"
      disabled: true
    - name: vendedor
      value: "524"
      type: query
      description: ID do vendedor do cliente
      disabled: true
    - name: cpfcnpj
      value: "12345678909"
      type: query
      description: String - Opcional - CPF ou CNPJ exato, como está gravado (normalmente só números). Aceita `%` como curinga.
      disabled: true
    - name: email
      value: emailcliente@provedor.com.br
      type: query
      description: String - Opcional - E-mail exato (sem diferenciar maiúsculas). Aceita `%` como curinga.
      disabled: true
    - name: ativo
      value: S
      type: query
      description: Enum('S', 'N') - Opcional - Só clientes ativos (S) ou inativos (N).
      disabled: true
    - name: nascimento
      value: 25/12
      type: query
      description: "String (DD/MM) - Opcional - Aniversariantes do dia: filtra pelo dia e mês de `data_nascimento`."
      disabled: true
    - name: fields
      value: id,nome,email,celular_ddd,celular
      type: query
      description: "String - Opcional - Campos de cada cliente na resposta, separados por vírgula. Padrão: id,cadastro_tipo,tipo_pessoa,nome,sexo,data_nascimento,cpfcnpj,email,fone_ddd,fone,celular_ddd,celular. Os campos extras do cadastro vêm sempre."
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Quantidade de clientes por página (padrão 10, máximo 100)
      disabled: true
    - name: page
      value: "2"
      type: query
      description: Número da página referente a paginação de resultados
      disabled: true
    - name: lastupdate_gte
      value: 2026-07-01
      type: query
      description: Date - Opcional - Alterados a partir desta data/hora. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: lastupdate_lte
      value: 2026-07-31 23:59:59
      type: query
      description: Date - Opcional - Alterados até esta data/hora. Data sem hora vale como 00:00:00. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: created_gte
      value: 2026-07-01
      type: query
      description: Date - Opcional - Cadastrados a partir desta data/hora. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
    - name: created_lte
      value: 2026-07-31 23:59:59
      type: query
      description: Date - Opcional - Cadastrados até esta data/hora. Data sem hora vale como 00:00:00. Aceita `AAAA-MM-DD`, `AAAA-MM-DD HH:MM:SS` ou `DD/MM/AAAA`.
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

