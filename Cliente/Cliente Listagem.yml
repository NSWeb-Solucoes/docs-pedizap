docs: |-
  <p>Lista os clientes da loja, do mais recente para o mais antigo, em páginas de 10 (até 100 com <code>limit</code>).</p>

  <ul>
    <li>Todos os filtros são opcionais e se combinam (E).</li>
    <li><code>q</code> faz uma busca textual nos dados do cliente; <code>alfa</code> filtra pela primeira letra do nome.</li>
    <li><code>email</code> e <code>cpfcnpj</code> buscam o valor exato, sem diferenciar maiúsculas, e aceitam <code>%</code> como curinga.</li>
    <li><code>nascimento</code> no formato <code>DD/MM</code> traz os aniversariantes do dia.</li>
    <li><code>fields</code> escolhe os campos de cada cliente na resposta.</li>
  </ul>

  <p>Na resposta, <code>totalRegistros</code> conta os clientes desta página, <code>totalGeralRegistros</code> o total da busca e <code>totalPaginas</code> quantas páginas existem.</p>
