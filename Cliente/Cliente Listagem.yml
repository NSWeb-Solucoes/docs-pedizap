info:
  name: Cliente Listagem
  type: http
  seq: 1
  tags:
    - Clientes

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/cliente"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: filter_tipo
      value: "1"
      type: query
      description: Filtrando o ID do tipo de cadastro
      disabled: true
    - name: q
      value: ""
      type: query
      description: Pesquisa textual nos dados do cliente.
      disabled: true
    - name: alfa
      value: r
      type: query
      description: "Primeira letra do nome a ser pesquisado. Ex: a"
      disabled: true
    - name: vendedor
      value: "524"
      type: query
      description: ID do vendedor do cliente
      disabled: true
    - name: limit
      value: ""
      type: query
      description: Quantidade de resultados por página
      disabled: true
    - name: page
      value: "2"
      type: query
      description: Número da página referente a paginação de resultados
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

