docs: |-
  <p> Para inserir novos clientes, os campos a seguir devem ser passados pelo body </p>

  <ul>
  <li> <strong> nome: </strong> O nome do novo cliente a ser inserido </li>
  <li> <strong> tipo_pessoa: </strong> Nesse campo é especificado se a pessoa é fisica ou juridica, "F" para física e "J" para jurídica</li>
  <li> <strong> cpfcnpj: </strong> O número do documento, sendo cpf ou o cnpj </li>
  <li> <strong> rgie: </strong> Número do RG </li>
  <li> <strong> fone_ddd: </strong> O número do ddd do telefone do cliente </li>
  <li> <strong> fone: </strong> O numero de telefone do cliente</li>
  <li> <strong> email: </strong> O email do cliente </li>
  </ul>

  <p> Os campos acimas são os campos obrigatórios, os outros campos estão na response do exemplo da requisição </p>
