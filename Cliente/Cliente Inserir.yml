info:
  name: Cliente Inserir
  type: http
  seq: 3
  tags:
    - Clientes

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/cliente"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: multipart-form
    data:
      - name: nome
        type: text
        value: Ola meus amigos
        description: Nome completo do cliente
      - name: tipo_pessoa
        type: text
        value: ""
        description: '"F" para pessoa fisica ou "J" para pessoa juridica'
      - name: cpfcnpj
        type: text
        value: ""
        description: CPF (pessoa fisica) ou CNPJ (pessoa juridica), sem mascara
      - name: rgie
        type: text
        value: ""
        description: RG (pessoa fisica) ou Inscricao Estadual (pessoa juridica)
      - name: fone_ddd
        type: text
        value: ""
        description: DDD do telefone fixo
      - name: fone
        type: text
        value: ""
        description: Numero do telefone fixo, sem o DDD
      - name: email
        type: text
        value: ""
        description: E-mail do cliente
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

