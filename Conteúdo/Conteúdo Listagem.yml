docs: |-
  <p>Listagem de conteúdos. Diferente do site, a API também retorna os conteúdos não publicados
  (<code>published = "N"</code>), para permitir a gestão de rascunhos.</p>

  <p>Para buscar vários conteúdos por id, use a querystring <code>?id=1,2,3</code> — a forma
  <code>/api/content/1,2,3</code> não é aceita pelo roteador.</p>
