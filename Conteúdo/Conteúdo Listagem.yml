info:
  name: Conteúdo Listagem
  type: http
  seq: 1
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: category
      value: ''
      type: query
      description: 'Filtra por id da categoria (opcional)'
      disabled: true
    - name: limit
      value: ''
      type: query
      description: 'Quantidade de registros (opcional)'
      disabled: true
    - name: page
      value: ''
      type: query
      description: 'Pagina da listagem (opcional)'
      disabled: true
    - name: order
      value: ''
      type: query
      description: 'Ordenacao, ex: "date DESC" (opcional)'
      disabled: true
    - name: search
      value: ''
      type: query
      description: 'Termo de busca no titulo e no corpo (opcional)'
      disabled: true
    - name: id
      value: ''
      type: query
      description: 'Um id ou varios separados por virgula (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

