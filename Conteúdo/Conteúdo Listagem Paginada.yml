info:
  name: Conteúdo Listagem Paginada
  type: http
  seq: 2
  tags:
    - Conteúdos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/content/pagination"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: category
      value: ''
      type: query
      description: 'Filtra por id da categoria (opcional)'
      disabled: true
    - name: limit
      value: ''
      type: query
      description: 'Quantidade de registros por pagina (opcional)'
      disabled: true
    - name: page
      value: ''
      type: query
      description: 'Pagina da listagem (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/content/pagination"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: category
          value: ''
          type: query
          description: 'Filtra por id da categoria (opcional)'
          disabled: true
        - name: limit
          value: ''
          type: query
          description: 'Quantidade de registros por pagina (opcional)'
          disabled: true
        - name: page
          value: ''
          type: query
          description: 'Pagina da listagem (opcional)'
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"pagina":1,"totalRegistros":1,"totalGeralRegistros":"38","totalPaginas":38,"registroInicio":1,"registroFim":1,"contents":[{"id":"33","site_id":"109","category_id":"121","title":"Empresa","published":"Y","linkPage":"https:\/\/loja.com.br\/site\/conteudo\/33-empresa.html"}]}'
