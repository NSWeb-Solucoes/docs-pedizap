http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/content/:conteudoId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: conteudoId
      value: "{{conteudoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: category_id
        value: '121'
        description: 'Id da categoria do conteudo (obrigatorio)'
      - name: title
        value: 'Novo conteudo'
        description: 'Titulo do conteudo (obrigatorio, ate 255 caracteres)'
      - name: date
        value: '16/08/2026'
        description: 'Data do conteudo no formato dd/mm/aaaa (opcional)'
      - name: resume
        value: 'Resumo do conteudo'
        description: 'Resumo/chamada (opcional)'
      - name: content
        value: '<p>Corpo do conteudo</p>'
        description: 'Corpo do conteudo em HTML (opcional)'
      - name: tags
        value: 'tag1,tag2'
        description: 'Palavras chave separadas por virgula (opcional)'
      - name: published
        value: 'Y'
        description: '"Y"/"N" (default "Y") - publica o conteudo'
      - name: show_date
        value: 'N'
        description: '"Y"/"N" (default "N") - exibe a data no site'
      - name: priority
        value: '1'
        description: 'Ordenacao dentro da categoria (opcional)'
      - name: image_preview
        value: ''
        description: 'Caminho da imagem de destaque na galeria de midia (opcional)'
      - name: template_name
        value: ''
        description: 'Template do conteudo (opcional)'
  auth: inherit

settings:
