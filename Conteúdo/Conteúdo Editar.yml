docs: |-
  <p>Não é necessário reenviar todos os campos — os que não forem informados são mantidos como estão.</p>

  <p>Os únicos campos obrigatórios são <strong>category_id</strong> e <strong>title</strong>.</p>

  <p><strong>Campos extras (extrafields):</strong> basta enviar cada campo pela própria <code>key</code> do
  extrafield, junto dos demais campos do formulário. Para descobrir quais chaves valem para uma categoria,
  consulte <code>GET /api/content/extrafields?category_id=:id</code>.</p>

  <p><strong>SEO:</strong> os campos de SEO podem ser gravados na mesma chamada usando o prefixo
  <code>seo_</code> (<code>seo_link</code>, <code>seo_meta_title</code>, <code>seo_meta_description</code>,
  <code>seo_meta_keywords</code>, <code>seo_og_title</code>, <code>seo_og_description</code>,
  <code>seo_og_image</code>). Os blocos <code>custom_meta</code> e <code>custom_og</code> são ligados
  automaticamente quando algum campo do bloco é informado.</p>

  <p><strong>Foto:</strong> é possível anexar a primeira foto do álbum já na criação, enviando um dos três
  conjuntos de campos: <code>photo_url</code> (URL da imagem), <code>photo_file</code> (upload multipart) ou
  <code>photo_data</code>+<code>photo_filename</code> (base64), mais opcionalmente
  <code>photo_description</code>. Para as demais fotos use <code>/api/content/:id/fotos</code>.</p>

  <p><strong>Encoding:</strong> em <code>application/x-www-form-urlencoded</code> o payload deve estar em
  ISO-8859-1. Enviando o corpo como <code>application/json</code> o UTF-8 é convertido automaticamente.</p>
