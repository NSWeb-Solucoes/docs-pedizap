info:
  name: SEO Inserir
  type: http
  seq: 3
  tags:
    - SEO

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/seotool"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  body:
    type: form-urlencoded
    data:
      - name: item_type
        value: 'content'
        description: 'Tipo do item (obrigatorio). Ver lista na descricao'
      - name: item_id
        value: '258'
        description: 'Id do item. Obrigatorio, exceto para "custom" e "redirect"'
      - name: custom_link
        value: 'Y'
        description: '"Y"/"N" - liga o link personalizado'
      - name: link
        value: '/minha-url'
        description: 'URL personalizada de origem. Obrigatoria quando custom_link = "Y"'
      - name: link_destino
        value: ''
        description: 'URL de destino. Usada apenas em item_type "custom" e "redirect"'
      - name: sitemap
        value: 'Y'
        description: '"Y"/"N" (default "Y") - indexar em buscadores'
      - name: meta_title
        value: ''
        description: 'Meta title da pagina'
      - name: meta_appendtitle
        value: 'N'
        description: '"Y"/"N" - concatena com o titulo padrao do site'
      - name: meta_description
        value: ''
        description: 'Meta description da pagina'
      - name: meta_keywords
        value: ''
        description: 'Palavras chave separadas por virgula'
      - name: og_title
        value: ''
        description: 'OpenGraph title'
      - name: og_description
        value: ''
        description: 'OpenGraph description'
      - name: og_image
        value: ''
        description: 'Caminho da imagem de OpenGraph na galeria de midia'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

