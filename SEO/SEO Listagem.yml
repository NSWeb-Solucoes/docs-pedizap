info:
  name: SEO Listagem
  type: http
  seq: 1
  tags:
    - SEO

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/seotool"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: item_type
      value: 'content'
      type: query
      description: 'Filtra pelo tipo do item (opcional)'
      disabled: true
    - name: item_id
      value: ''
      type: query
      description: 'Filtra pelo id do item (opcional)'
      disabled: true
    - name: custom_link
      value: ''
      type: query
      description: 'Filtra por "Y"/"N" (opcional)'
      disabled: true
    - name: sitemap
      value: ''
      type: query
      description: 'Filtra por "Y"/"N" (opcional)'
      disabled: true
    - name: link
      value: ''
      type: query
      description: 'Busca parcial pela URL personalizada (opcional)'
      disabled: true
    - name: limit
      value: '50'
      type: query
      description: 'Registros por pagina (default 50)'
      disabled: true
    - name: page
      value: ''
      type: query
      description: 'Pagina da listagem (opcional)'
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

