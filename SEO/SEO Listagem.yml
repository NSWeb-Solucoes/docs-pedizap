docs: |-
  <p>Os registros de SEO são polimórficos, identificados pelo par
  <strong>item_type</strong> + <strong>item_id</strong>. Valores aceitos em <code>item_type</code>:</p>

  <ul>
      <li><code>content</code>, <code>content_category</code></li>
      <li><code>product</code>, <code>product_category</code>, <code>product_grupo</code>, <code>product_manufacturer</code></li>
      <li><code>anuncio_category</code></li>
      <li><code>veiculo</code>, <code>veiculo_tipo</code>, <code>veiculo_marca</code></li>
      <li><code>custom</code>, <code>redirect</code> — não usam <code>item_id</code></li>
  </ul>

  <p><strong>link x link_destino:</strong> <code>link</code> é a URL bonita de origem e
  <code>link_destino</code> é a URL real de destino. Para os itens do catálogo o
  <code>link_destino</code> é calculado automaticamente a partir do próprio item — só é informado
  manualmente em <code>custom</code> e <code>redirect</code>.</p>

  <p>Cada item pode ter apenas um registro de SEO. Os blocos <code>custom_meta</code> e
  <code>custom_og</code> são ligados automaticamente quando algum campo do bloco é informado.</p>
