info:
  name: SEO Detalhe
  type: http
  seq: 2
  tags:
    - SEO

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/seotool/:seoId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: seoId
      value: "{{seoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/seotool/:seoId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: seoId
          value: "{{seoId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"seos":{"seo":[{"id":"10066","site_id":"109","item_type":"content_category","item_id":"361","custom_meta":"Y","custom_link":"Y","sitemap":"Y","link":"\/promo-api-teste","link_destino":"\/site\/conteudo\/categoria-api-teste","meta_title":"SEO Categoria API","meta_appendtitle":"N","meta_description":null,"meta_keywords":null,"custom_og":"N","og_title":null,"og_description":null,"og_image":null,"admin_link":"\/cms\/seotool\/form\/item_type\/seotool\/item_id\/10066"}]}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/seotool/:seoId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: seoId
          value: "{{seoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/seotool/:seoId"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: seoId
          value: "{{seoId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Registro de SEO n\u00e3o informado, n\u00e3o encontrado ou atributo \"id\" faltando."}'

docs: |-
  <p>O <code>:seoId</code> é o id do próprio registro de seotool, não o id do item.</p>
