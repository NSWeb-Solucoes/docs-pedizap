docs: '<p>Período de agenda (horário/dias da semana) de um serviço, usado quando o serviço tem <code>agendamento="S"</code>. A prioridade (<code>priority</code>) de exibição é controlada pelo servidor: novos períodos entram sempre no final da lista.</p>'
