info:
  name: Períodos Listagem
  type: http
  seq: 1
  tags:
    - Entrega

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo"
      method: GET
