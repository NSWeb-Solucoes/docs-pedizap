info:
  name: Período Inserir
  type: http
  seq: 3
  tags:
    - Entrega

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
  body:
    type: multipart-form
    data:
      - name: hora_ini
        type: text
        value: 21:00
        description: Hora de inicio do periodo, formato HH:mm
      - name: hora_fim
        type: text
        value: 22:00
        description: Hora de fim do periodo, formato HH:mm
      - name: descricao
        type: text
        value: awdawdadwadwadw
        description: Descricao do periodo (obrigatorio)
      - name: dom
        type: text
        value: ""
        description: '"1" disponivel aos domingos; "0"/vazio indisponivel'
      - name: seg
        type: text
        value: ""
        description: '"1" disponivel as segundas; "0"/vazio indisponivel'
        disabled: true
      - name: ter
        type: text
        value: ""
        description: '"1" disponivel as tercas; "0"/vazio indisponivel'
        disabled: true
      - name: qua
        type: text
