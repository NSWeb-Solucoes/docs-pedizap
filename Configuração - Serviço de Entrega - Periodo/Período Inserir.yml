        disabled: true
      - name: sex
        type: text
        value: ""
        description: '"1" disponivel as sextas; "0"/vazio indisponivel'
        disabled: true
      - name: sab
        type: text
        value: ""
        description: '"1" disponivel aos sabados; "0"/vazio indisponivel'
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

