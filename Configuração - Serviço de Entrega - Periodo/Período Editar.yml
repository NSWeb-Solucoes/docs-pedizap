info:
  name: Período Editar
  type: http
  seq: 4
  tags:
    - Entrega

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo/:periodoId"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
    - name: periodoId
      value: "{{periodoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: hora_ini
        value: 09:00
        description: Hora de inicio do periodo, formato HH:mm
      - name: hora_fim
        value: 10:00
        description: Hora de fim do periodo, formato HH:mm
      - name: descricao
        value: ""
        description: Descricao do periodo
      - name: dom
        value: ""
        description: '"1" disponivel aos domingos; "0"/vazio indisponivel'
      - name: seg
        value: ""
        description: '"1" disponivel as segundas; "0"/vazio indisponivel'
      - name: ter
        value: ""
        description: '"1" disponivel as tercas; "0"/vazio indisponivel'
      - name: qua
        value: ""
        description: '"1" disponivel as quartas; "0"/vazio indisponivel'
      - name: qui
        value: ""
        description: '"1" disponivel as quintas; "0"/vazio indisponivel'
      - name: sex
        value: ""
        description: '"1" disponivel as sextas; "0"/vazio indisponivel'
      - name: sab
        value: ""
        description: '"1" disponivel aos sabados; "0"/vazio indisponivel'
      - name: published
        value: ""
        description: '"Y" (ativo) ou "N" (inativo)'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

