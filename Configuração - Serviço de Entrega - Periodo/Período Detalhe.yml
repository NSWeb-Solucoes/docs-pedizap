info:
  name: Período Detalhe
  type: http
  seq: 2
  tags:
    - Entrega

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo/:periodoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: servicoId
      value: "{{servicoId}}"
      type: path
    - name: periodoId
      value: "{{periodoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo/:periodoId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: periodoId
          value: "{{periodoId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","periodo":{"id":"4","site_id":"5095","servico_id":"3","descricao":"Hor\u00e1rio comercial","hora_ini":"08:00","hora_fim":"18:00","seg":"1","ter":"1","qua":"1","qui":"1","sex":"1","sab":"0","dom":"0","published":"Y","priority":"0"}}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo/:periodoId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: periodoId
          value: "{{periodoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 404 Response
    description: Not Found
    request:
      url: "{{proto}}://{{domain}}/api/entrega/servico/:servicoId/periodo/:periodoId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: servicoId
          value: "{{servicoId}}"
          type: path
        - name: periodoId
          value: "{{periodoId}}"
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Periodo nao encontrado."}'
