info:
  name: Buscar modules disponíveis
  type: http
  seq: 1
  tags:
    - Webhook

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/webhook/module"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  auth: inherit
 
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/webhook/module"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","modules":[{"id":"1","name":"content","title":"Conte\u00fado","description":"M\u00f3dulo para conte\u00fados de sites e blogs","priority":"2","suport_webhook":"Y"},{"id":"11","name":"order","title":"Pedidos","description":"M\u00f3dulo para as informa\u00e7\u00f5es de pedidos","priority":"5","suport_webhook":"Y"},{"id":"12","name":"tema","title":"Tema","description":"M\u00f3dulo para op\u00e7\u00f5es de tema no E-Commerce","priority":"5","suport_webhook":"N"},{"id":"23","name":"entregador","title":"Entregadores","description":"Gerencie seus entregadores","priority":"6","suport_webhook":"N"},{"id":"22","name":"campaign","title":"Campanhas de Marketing","description":"Programe campanhas de marketing para enviar no email ou whatsapp","priority":"6","suport_webhook":"N"},{"id":"21","name":"qrcode","title":"Pedidos por QRCode","description":"Habilitar pedidos feitos por QRCode em mesas, bal\u00e7\u00f5es e quartos.","priority":"6","suport_webhook":"N"},{"id":"7","name":"product","title":"Produtos","description":"M\u00f3dulo de Cat\u00e1logo de produtos","priority":"6","suport_webhook":"Y"},{"id":"4","name":"header","title":"Topos","description":null,"priority":"10","suport_webhook":"N"},{"id":"6","name":"banner","title":"Banner","description":"M\u00f3dulo para banners de sites e blogs","priority":"12","suport_webhook":"N"},{"id":"9","name":"cadastro","title":"Cadastro","description":"M\u00f3dulo para as informa\u00e7\u00f5es de clientes","priority":"13","suport_webhook":"Y"},{"id":"14","name":"promocao","title":"Promo\u00e7\u00f5es","description":"M\u00f3dulo para as informa\u00e7\u00f5es de cupons de descontos","priority":"14","suport_webhook":"N"},{"id":"24","name":"cashback","title":"Cashback","description":"M\u00f3dulo de cashback e programa de fidelidade","priority":"20","suport_webhook":"N"},{"id":"25","name":"pdv","title":"PDV","description":"M\u00f3dulo de PDV para vendas presenciais","priority":"20","suport_webhook":"N"}]}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/webhook/module"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: |-
  Endpoint para buscar todos os módulos disponiveis no sistema.

  Para saber se o módulo tem suporte a webhook é usado o campo **suport_webhook**.
