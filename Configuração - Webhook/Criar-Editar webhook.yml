info:
  name: Criar/Editar webhook
  type: http
  seq: 6
  tags:
    - Webhook

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/webhook"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  body:
    type: form-urlencoded
    data:
      - name: webhook_url
        value: proto://domain/path
        description: URL de destino que recebe via POST os eventos do webhook; obrigatorio, e precisa ser unica (nao pode repetir a de outro destino do mesmo site)
      - name: module_ids
        value: "1"
        description: "IDs dos modulos que disparam esse webhook, separados por virgula (ex: 1=conteudo, 7=produto, 9=cliente, 11=pedido, 19=formularios); use GET /api/webhook/module para a lista real de modulos disponiveis no site"
      - name: actived
        value: Y
        description: '"Y" (ativo) ou "N" (inativo)'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/webhook"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: form-urlencoded
        data:
          - name: webhook_url
            value: ""
            description: URL de destino que recebe via POST os eventos do webhook; obrigatorio, e precisa ser unica (nao pode repetir a de outro destino do mesmo site)
          - name: module_ids
