    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/webhook"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: form-urlencoded
        data:
          - name: webhook_url
            value: ""
            description: URL de destino que recebe via POST os eventos do webhook; obrigatorio, e precisa ser unica (nao pode repetir a de outro destino do mesmo site)
          - name: module_ids
            value: ""
            description: "IDs dos modulos que disparam esse webhook, separados por virgula (ex: 1=conteudo, 7=produto, 9=cliente, 11=pedido, 19=formularios); use GET /api/webhook/module para a lista real de modulos disponiveis no site"
          - name: actived
            value: ""
            description: '"Y" (ativo) ou "N" (inativo)'
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"A URL informada j\u00e1 est\u00e1 sendo utilizada por outro Webhook, voc\u00ea pode ativa-la ou adicionar o modulo nela"}'

docs: |-
  Endpoint para criar ou editar um webhook.

  **Lembrando!** Nesse endpoint os atributos 'module_ids', 'webhook_url', 'actived' são obrigatórios independente de se for edição ou criação, se não forem informatos retornará error.
