            description: "IDs dos modulos que disparam esse webhook, separados por virgula (ex: 1=conteudo, 7=produto, 9=cliente, 11=pedido, 19=formularios); use GET /api/webhook/module para a lista real de modulos disponiveis no site"
          - name: actived
            value: ""
            description: '"Y" (ativo) ou "N" (inativo)'
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"msg":"A Webhook foi salvo com sucesso!","status":"success"}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/webhook"
      method: POST
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      body:
        type: form-urlencoded
        data:
          - name: webhook_url
            value: ""
