info:
  name: Delete webhook
  type: http
  seq: 3
  tags:
    - Webhook

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/webhook/:webhookId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: webhookId
      value: "{{webhookId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: webhook_url
        value: ""
      - name: module_ids
        value: ""
      - name: actived
        value: ""
  auth: inherit
 
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
