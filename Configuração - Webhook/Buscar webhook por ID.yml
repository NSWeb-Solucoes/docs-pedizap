info:
  name: Buscar webhook por ID
  type: http
  seq: 2
  tags:
    - Webhook

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/webhook/:webhookId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: webhookId
      value: "{{webhookId}}"
      type: path
  auth: inherit
 
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/webhook/:webhookId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: webhookId
          value: "{{webhookId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"totalRegistros":1,"webhooks":[{"id":"30","site_id":"5095","module_ids":"11","webhook_url":"https:\/\/cardapioqrcode.pedizap.com.br\/opendelivery\/v1\/newEvent","delivery_mode":"push","client_id":null,"merchant_id":"123e4567-e89b-412d-a456-426614174000","credential_id":"1","actived":"Y","created_at":"2026-07-16 11:01:59","updated_at":"2026-07-16 11:29:53"}]}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/webhook/:webhookId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: webhookId
          value: "{{webhookId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/webhook/:webhookId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: webhookId
          value: "{{webhookId}}"
          type: path
