info:
  name: Buscar webhooks
  type: http
  seq: 5
  tags:
    - Webhook

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/webhook"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: modules_names
      value: product,order
      type: query
      description: String - String - Filtra os webhooks por módulos. Se o name passado não existir, não será considerado no filtro
    - name: modules
      value: 7,11,3
      type: query
      description: String - Optional - Filtra os webhooks por módulos
    - name: url
      value: proto://domain/path
      type: query
      description: String - Opcional - Filtra pela url cadastrada no webhook
    - name: actived
      value: Y
      type: query
      description: Enum('Y','N') - String - Filtra webhooks ativos
    - name: page
      value: "1"
      type: query
      description: Integer - Opcional - Apartir do limit é criado a paginação da busca. Por padrão será a page 1
    - name: order
      value: webhook_url
      type: query
      description: String - Optional - Ordenação da lista.
    - name: limit
      value: "20"
      type: query
      description: Integer - Opcional - Qtde retornada de registros. O padrão do sistema é 20
  auth: inherit
 
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

