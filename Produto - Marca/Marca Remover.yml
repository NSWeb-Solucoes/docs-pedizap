info:
  name: Marca Remover
  type: http
  seq: 5
  tags:
    - Marcas

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/marca/:marcaId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: marcaId
      value: "{{marcaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
    response:
      status: 422
