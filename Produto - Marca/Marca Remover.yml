info:
  name: Marca Remover
  type: http
  seq: 5
  tags:
    - Marcas

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/marca/:marcaId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: marcaId
      value: "{{marcaId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autenticação inválida."}'
  - name: 422 Marca não encontrada
    description: O `marcaId` não existe na loja. Neste DELETE, o erro volta sem corpo.
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: DELETE
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""

docs: |-
  <p>Remove a marca. A resposta é <code>204</code>, sem corpo.</p>

  <p>Os produtos da marca não são alterados: continuam com o <code>manufacturer_id</code> da marca removida. Para desvincular, edite os produtos antes.</p>
