info:
  name: Marca Listagem
  type: http
  seq: 1
  tags:
    - Marcas

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/marca"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Listar marcas
    description: "Todas as marcas da loja vêm de uma vez em `marca`, publicadas ou não: a terceira está despublicada (`published=N`)."
    request:
      url: "{{proto}}://{{domain}}/api/marca"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"marca":[{"id":"1","site_id":"5095","name":"Kibon","image":null,"priority":"1","published":"Y"},{"id":"2","site_id":"5095","name":"Nestlé","image":null,"priority":"2","published":"Y"},{"id":"3","site_id":"5095","name":"Fabricação própria","image":null,"priority":"3","published":"N"}]}'
  - name: 200 Nenhuma marca cadastrada
    description: Sem marcas cadastradas, `marca` vem como lista vazia.
    request:
      url: "{{proto}}://{{domain}}/api/marca"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"marca":[]}'
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/marca"
      method: GET
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: |-
  <p>Lista as marcas (fabricantes) da loja, publicadas ou não, dentro de <code>marca</code>.</p>

  <ul>
    <li>Não há filtros nem paginação: a resposta traz todas as marcas de uma vez.</li>
    <li>A lista não vem ordenada por <code>priority</code>. Para exibir na ordem da loja, ordene pelo <code>priority</code> do seu lado.</li>
  </ul>

  <p>Campos de cada marca:</p>

  <ul>
    <li><code>id</code>: id da marca, usado no <code>manufacturer_id</code> do produto.</li>
    <li><code>site_id</code>: id da loja.</li>
    <li><code>name</code>: nome, com até 50 caracteres.</li>
    <li><code>image</code>: endereço da imagem da marca, em texto livre (a API não valida), ou <code>null</code>.</li>
    <li><code>priority</code>: ordem de exibição.</li>
    <li><code>published</code>: <code>Y</code> (publicada) ou <code>N</code> (despublicada).</li>
  </ul>

  <p>Para buscar uma marca pelo id, use <a href="./Marca%20Detalhe.yml">Marca Detalhe</a>. Para listar os produtos de uma marca, use o filtro <code>marca</code> em <a href="../Produto/Produto%20Listagem.yml">Produto Listagem</a>.</p>
