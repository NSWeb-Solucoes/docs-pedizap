info:
  name: Marca Editar
  type: http
  seq: 4
  tags:
    - Marcas

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/marca/:marcaId"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  params:
    - name: marcaId
      value: "{{marcaId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: name
        value: OLA MEUS AMIIIGOS
        description: Nome da marca (obrigatorio, ate 50 caracteres)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: PUT
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da marca (obrigatorio, ate 50 caracteres)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "success"
          }
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/marca/:marcaId"
      method: PUT
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      params:
        - name: marcaId
          value: "{{marcaId}}"
          type: path
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da marca (obrigatorio, ate 50 caracteres)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "msg": "Marca não informada, ou atributo \"id\" faltando."
          }
