info:
  name: Marca Inserir
  type: http
  seq: 3
  tags:
    - Marcas

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/marca"
  headers:
    - name: Accept
      value: "{{format}}"
    - name: Authorization
      value: "{{token}}"
  body:
    type: form-urlencoded
    data:
      - name: name
        value: Ferrari
        description: Nome da marca (obrigatorio, ate 50 caracteres)
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Created
    request:
      url: "{{proto}}://{{domain}}/api/marca"
      method: POST
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da marca (obrigatorio, ate 50 caracteres)
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "success",
            "marca": {
              "id": "2",
              "site_id": "6038",
              "name": "Teste Marca 22/12 11:45",
              "image": null,
              "priority": "1",
              "published": "Y"
            }
          }
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/marca"
      method: POST
      headers:
        - name: Accept
          value: "{{format}}"
        - name: Authorization
          value: "{{token}}"
      body:
        type: form-urlencoded
        data:
          - name: name
            value: ""
            description: Nome da marca (obrigatorio, ate 50 caracteres)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "errorlist": {
              "name": [
                "Nome não informado"
              ]
            }
          }
