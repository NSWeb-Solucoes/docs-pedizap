info:
  name: Tabela Listagem
  type: http
  seq: 1
  tags:
    - Tabelas de Preço

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pricetable"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "1",
              "site_id": "5095",
              "name": "Tabela Teste Preço Fixo 15/AGO",
              "description": "Teste texto grande com quebra de linha para explicar que essa tabela é de clientes do programa de Fidelidade",
              "price_fixed": "N",
              "products_fixed": "N",
              "price_perc": "0",
              "lastupdate": null,
              "lastupdate_user": null,
              "rows": "0"
            },
            {
              "id": "2",
              "site_id": "5095",
              "name": "Tabela Teste Preço Fixo 15/AGO",
              "description": "Teste texto grande com quebra de linha para explicar que essa tabela é de clientes do programa de Fidelidade",
              "price_fixed": "N",
              "products_fixed": "N",
              "price_perc": "0",
              "lastupdate": null,
              "lastupdate_user": null,
              "rows": "0"
            }
          ]
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: Detalha as informações de uma tabela especifica.
