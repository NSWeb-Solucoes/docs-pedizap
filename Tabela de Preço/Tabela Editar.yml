info:
  name: Tabela Editar
  type: http
  seq: 4
  tags:
    - Tabelas de Preço

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/pricetable/:precoId"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  params:
    - name: precoId
      value: "{{precoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: name
        value: oi
        description: Nome da tabela de preco (obrigatorio, ate 50 caracteres)
      - name: description
        value: ""
        description: Descricao livre da tabela de preco (opcional)
      - name: price_fixed
        value: Y
        description: '"Y" ou "N" (default "N"). Quando "Y", os precos nao vem de registros individuais e sim de um desconto percentual (price_perc) aplicado sobre o preco atual do produto'
      - name: products_fixed
        value: Y
        description: '"Y" ou "N" (default "N"). Quando "Y", restringe o cliente a comprar somente os produtos cadastrados nesta tabela; independente de price_fixed'
      - name: price_perc
        value: ""
        description: Percentual de desconto aplicado sobre o preco do produto; usado somente quando price_fixed = "Y"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
