info:
  name: Tabela Remover
  type: http
  seq: 5
  tags:
    - Tabelas de Preço

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/pricetable/:precoId"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  params:
    - name: precoId
      value: "{{precoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/:precoId"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "status": "error",
            "msg": "Tabela de preço não encontrada"
          }
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/:precoId"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/:precoId"
      method: DELETE
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: Remove uma tabela de preço e os registros de preço vinculados a ela.
