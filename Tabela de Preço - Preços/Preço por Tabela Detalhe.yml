info:
  name: Preço por Tabela Detalhe
  type: http
  seq: 2
  tags:
    - Tabelas de Preço

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pricetable/:precoId/prices/:preco"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  params:
    - name: preco
      value: "{{preco}}"
      type: path
    - name: precoId
      value: "{{precoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/:precoId/prices/:preco"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: preco
          value: "{{preco}}"
          type: path
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "1",
            "site_id": "5095",
            "pricetable_id": "2",
            "product_code": "",
            "product_id": "1970",
            "price": "235.57",
            "price_promo": "0"
          }
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/pricetable/:precoId/prices/:preco"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: preco
          value: "{{preco}}"
          type: path
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autentica\u00e7\u00e3o inv\u00e1lida."}'

docs: Detalha um registro específico de preço dentro da tabela.
