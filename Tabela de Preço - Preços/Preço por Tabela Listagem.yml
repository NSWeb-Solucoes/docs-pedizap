      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: "{{token}}"
      params:
        - name: precoId
          value: "{{precoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
