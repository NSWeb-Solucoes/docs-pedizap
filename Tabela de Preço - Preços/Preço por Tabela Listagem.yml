info:
  name: Preço por Tabela Listagem
  type: http
  seq: 1
  tags:
    - Tabelas de Preço

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pricetable/:precoId/prices"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  params:
    - name: precoId
      value: "{{precoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
