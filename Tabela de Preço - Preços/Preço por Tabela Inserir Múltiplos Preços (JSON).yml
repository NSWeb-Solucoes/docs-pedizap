info:
  name: Preço por Tabela Inserir Múltiplos Preços (JSON)
  type: http
  seq: 4
  tags:
    - Tabelas de Preço

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/pricetable/:precoId/prices"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: "{{token}}"
  params:
    - name: precoId
      value: "{{precoId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "removeAll": false,
        "prices": [
          {
            "product_id": 1970,
            "price": 235.57,
            "price_promo": 0
          },
          {
            "product_id": 1870,
            "price": 12.91,
            "price_promo": 0
          },
          {
            "product_id": 1871,
            "price": 12.91,
            "price_promo": 0
          },
          {
            "product_id": 1969,
            "price": 235.56,
            "price_promo": 0
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

