docs: |-
  Este endpoint permite enviar um **JSON** contendo um array prices com múltiplos registros de preço, conforme o exemplo de payload abaixo.

  Opcionalmente, é possível incluir o parâmetro removeAll.

  - Quando removeAll for definido como **true**, todos os registros de preço existentes na tabela serão excluídos **antes** de importar os novos valores.
