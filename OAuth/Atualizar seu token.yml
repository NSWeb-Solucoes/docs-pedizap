info:
  name: Atualizar seu token
  type: http
  seq: 1
  tags:
    - OAuth

http:
  method: POST
  url: "{{proto}}://{{domain}}/api/oauth/jwtrefreshtoken?accessToken=eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0.."
  params:
    - name: accessToken
      value: eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0..
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{proto}}://{{domain}}/api/oauth/jwtrefreshtoken"
      method: POST
      params:
        - name: accessToken
          value: eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0..
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"success","accessToken":"eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0.."}'
  - name: 422 Response
    description: Unprocessable Entity
    request:
      url: "{{proto}}://{{domain}}/api/oauth/jwtrefreshtoken"
      method: POST
      params:
        - name: accessToken
          value: eyJ0eXAiOiJKV1QiLCJhbGciOiJub25lIn0..
          type: query
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"error","msg":"Token Inv\ufffdlido."}'
