info:
  name: Editar um pedido
  type: http
  seq: 3
  tags:
    - Pedidos

http:
  method: PUT
  url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: pedidoId
      value: "{{pedidoId}}"
      type: path
  body:
    type: form-urlencoded
    data:
      - name: status
        value: "3"
        description: Codigo numerico do status do pedido (1=Aberto, 2=Confirmado, 3=Cancelado, 4=Em Separacao, 5=Postado, 6=Finalizado); lista completa em GET /api/pedido/status
      - name: observacao
        value: ""
        description: Texto livre com observacao/nota interna sobre o pedido
      - name: obs_cancelamento
        value: ""
        description: Motivo do cancelamento; enviado junto com status=3 (Cancelado), fica registrado no historico do pedido
      - name: pago
        value: Y
        description: '"Y" (pago) ou "N" (nao pago)'
      - name: entrega_rastreiocodigo
        value: ""
        description: Codigo de rastreio da entrega
      - name: entrega_rastreiolink
        value: ""
        description: URL/link de rastreio da entrega
      - name: revisado_loja
        value: ""
        description: '"S" (revisado) ou "N" (nao revisado) - atencao, usa S/N e nao Y/N como o campo pago'
      - name: nfe_situacao
        value: ""
        description: "Situacao da NFe emitida para o pedido (ex: digitacao, validada, assinada, processamento, autorizada, cancelada, erro_denegada, erro_rejeitada, erro_transmissao, erro_pendenteretorno)"
      - name: nfe_dataemissao
        value: ""
        description: Data/hora de emissao da NFe, formato YYYY-MM-DD HH:MM:SS
      - name: nfe_numero
        value: ""
        description: Numero da nota fiscal emitida
      - name: nfe_linkimpressao
        value: ""
        description: URL para impressao/visualizacao do DANFE
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

