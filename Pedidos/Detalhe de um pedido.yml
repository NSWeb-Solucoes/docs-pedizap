  - name: 200 Produto com sub-produto
    description: "Sub-produto (variação de um produto): `product_id` é o ID da variação e `complemento` traz os atributos, como `Tamanho: Grande`. Vem com `kit=N` e sem a chave `extras`. O `parent_id` do item se refere ao item do pedido, não ao produto pai. Se a variação tiver extras, o item traz `complemento` e `extras` juntos."
    request:
      url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: pedidoId
