  type: http
  seq: 2
  tags:
    - Pedidos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: pedidoId
      value: "{{pedidoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

