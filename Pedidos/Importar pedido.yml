docs: |-
  Importa para a loja um pedido já fechado em outro sistema (ERP, PDV, balcão). O pedido entra como foi enviado: não passa pelo carrinho, não recalcula preços, não aplica cupom, promoção ou cashback e não calcula frete. A API só confere se o `total` bate com os itens.

  O corpo é JSON (`Content-Type: application/json`, em UTF-8).

  **Respostas**

  | HTTP | Quando |
  |---|---|
  | 201 | Pedido criado. Retorna `duplicado: false` e o `pedido` completo, no mesmo formato de `GET /api/pedido/:pedidoId`. |
  | 200 | A `referencia` já foi importada. Retorna `duplicado: true` e o pedido como está gravado. |
  | 422 | Erro de validação. `msg` traz todos os erros em um texto e `erros`, a lista. Nada é gravado. |
  | 401 | Chave de API inválida. |

  **Referência e reenvio**

  `referencia` é o id do pedido no sistema de origem e não se repete na loja. Reenviar a mesma `referencia` devolve o pedido já importado com HTTP 200, sem validar nem alterar nada, mesmo que o corpo seja diferente. Assim, um reenvio após timeout não duplica o pedido. Para alterar um pedido importado, use `PUT /api/pedido/:pedidoId`. Na listagem, os pedidos importados aparecem com `reference_name = "api"` e `reference_id` igual à `referencia`.

  **Conta do total**

  ```
  total = max(0, Σ(preco × quantidade − desconto do item) − desconto + acrescimo) + entrega_valor
  ```

  A diferença aceita é de 0,01. O `preco` é unitário e o `desconto` do item vale para a linha inteira.

  **Campos do pedido**

  | Campo | Obrigatório | Descrição |
  |---|---|---|
  | `referencia` | Sim | Id do pedido no sistema de origem. Até 100 caracteres. |
  | `status` | Não | `2` Confirmado (padrão), `3` Cancelado, `4` Em preparo, `5` Saiu para entrega, `6` Finalizado. |
  | `data` | Não | Data do pedido, `YYYY-MM-DD HH:MM:SS`. Padrão: o momento da importação. |
  | `itens` | Sim | Lista de itens, descrita abaixo. |
  | `total` | Sim | Total do pedido, conferido com a conta acima. |
  | `desconto` | Não | Desconto no pedido. Pode ser maior que os itens: o subtotal com desconto não fica negativo. |
  | `acrescimo` | Não | Acréscimo no pedido. |
  | `entrega_valor` | Não | Valor cobrado pela entrega. |
  | `observacao` | Não | Observação do pedido. |
  | `notificacliente` | Não | Padrão: envia ao cliente o e-mail e o WhatsApp de confirmação. `0`, `N` ou `false` não envia, útil para sincronizar pedidos antigos. Pedido cancelado nunca notifica. |

  **Cliente**

  | Campo | Descrição |
  |---|---|
  | `cliente_id` | Id de um cadastro da loja. Se não existir, retorna 422. |
  | `cliente_nome` | Nome do cliente. |
  | `cliente_celular` | DDD + número. Aceita máscara e o prefixo `+55`. |
  | `cliente_email` | E-mail do cliente. |
  | `cliente_cpf` | CPF ou CNPJ, com ou sem pontuação. |

  O cadastro é procurado nesta ordem: `cliente_id`, e-mail, celular e CPF. Um cadastro encontrado não é alterado: o pedido copia dele nome, e-mail, celular e CPF. Se nenhum for encontrado, um cadastro novo é criado quando há nome e ao menos um contato. Sem nenhum contato, o pedido fica sem cadastro e guarda só o nome.

  **Pagamento**

  | Campo | Descrição |
  |---|---|
  | `pagto_metodo` | Obrigatório: `pix`, `cartao`, `pagtoentrega`, `deposito`, `custom` ou `boleto`. Os gateways do checkout (`mercadopago`, `pagseguro`, `pagbank`, `paypal`...) não são aceitos. |
  | `pagto_metododesc` | Descrição da forma de pagamento. Em `pagtoentrega`, use `dinheiro`, `credito`, `debito`, `vale` ou `pix`, como no checkout. |
  | `pago` | `Y` (ou `S`) para pago, `N` para não pago. Padrão: `N`. |
  | `pagto_status` | `pending`, `in_process`, `approved` ou `cancelled`. Com `pago=Y` e sem este campo, fica `approved`. `approved` exige `pago=Y`. |
  | `pagto_data` | Data do pagamento. Com `pago=Y` e sem este campo, recebe a `data` do pedido. |
  | `pagto_bandeira` | Bandeira do cartão. |
  | `pagto_parcelas` | Número de parcelas, inteiro. |
  | `pagto_troco` | Troco para (pagamento em dinheiro). |
  | `pagto_ref` | Id da transação, chave do Pix ou linha digitável do boleto. |
  | `pagto_codigo` | NSU ou código da transação. |
  | `pagto_autorizacao` | Código de autorização. |
  | `pagto_statusinfo` | Texto do status devolvido pelo gateway. |
  | `pagto_valorautorizado` | Valor autorizado. |
  | `pagto_capturado` | `1`, `S`, `Y` ou `true` para capturado. |
  | `pagto_datacaptura` | Data da captura. |

  **Endereço de entrega**

  `end_entrega_cep`, `end_entrega_endereco`, `end_entrega_numero`, `end_entrega_complemento`, `end_entrega_referencia`, `end_entrega_bairro`, `end_entrega_cidade`, `end_entrega_uf`, `end_entrega_pais` e `end_entrega_geolocation` (`[latitude, longitude]`). Todos são opcionais; sem eles, o pedido fica sem endereço (retirada). Textos maiores que a coluna retornam 422 (ex.: `end_entrega_numero` aceita até 10 caracteres).

  **Itens**

  | Campo | Obrigatório | Descrição |
  |---|---|---|
  | `sku` ou `produto_id` | Sim | Produto da loja, pelo SKU ou pelo id. Precisa existir na loja. |
  | `quantidade` | Sim | Inteiro maior que zero. |
  | `preco` | Sim | Preço unitário, já com os adicionais. |
  | `desconto` | Não | Desconto da linha inteira. |
  | `obs` | Não | Observação do item. |
  | `adicionais` | Não | Lista de `{ "nome", "preco", "quantidade" }`. Só descrevem o item: o `preco` do item já deve incluí-los. Na resposta, viram itens com `parent_id` apontando para o item principal. |

  Valores numéricos podem ser número (`36.99`) ou texto com ponto decimal (`"36.99"`). Vírgula não é aceita.

  **Campos não aceitos**

  Retornam 422: qualquer campo que comece com `entrega_` (exceto `entrega_valor`), `entregador_`, `promocao_`, `qrcode_`, `nfe_`, `rota_`, `kds_` ou `end_cobranca_`, e os campos `session_id`, `email_sent`, `pagto_cashback`, `reference_name`, `reference_id`, `mktplace_reference`, `uuid` e `site_id`.

  **O que acontece depois de importar**

  - O histórico do pedido registra "Pedido importado via API" com a referência.
  - O estoque é baixado ou reservado conforme a configuração da loja (exceto em pedido cancelado).
  - O pedido entra nos relatórios e dispara os webhooks de pedido criado configurados na loja.
  - Se `notificacliente` não estiver desligado, o cliente recebe o e-mail e o WhatsApp de confirmação.
  - O pedido não é enviado para ERP.
