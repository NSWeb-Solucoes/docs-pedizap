  - name: 200 Filtrar últimos pedidos considerando status
    description: "Corte pelo status: `status=2` funciona como uma fila de pedidos confirmados, com `order=id ASC` atendendo os mais antigos primeiro e `limit=10` mantendo a consulta pequena. Depois de importar, o PDV muda o status com `PUT /api/pedido/:pedidoId`, por exemplo para `status=4`, e o pedido sai da fila. Sem essa mudança, ele volta em toda consulta. Um PIX aprovado depois entra na fila ao ser confirmado, então este corte não perde esse pedido. `status` aceita um valor por vez, e a API não tem filtro para excluir status. Sem `status`, só o Carrinho (7) fica de fora, então Aberto (1) e Cancelado (3) também vêm."
    request:
      url: "{{proto}}://{{domain}}/api/pedido"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: lastid
          value: "3200"
          type: query
          description: "INT - Opcional - Retorna os pedidos com ID maior que o informado."
          disabled: true
        - name: data_gte
          value: "2026-10-20 20:40:00"
          type: query
          description: "STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra pela data da confirmação do pedido. Maior ou igual a data."
          disabled: true
        - name: status
          value: "2"
          type: query
          description: "INT - Opcional - Filtra pelo status. Aceita um valor por vez. Sem esse filtro, só o Carrinho (7) fica de fora."
        - name: order
          value: id ASC
          type: query
        - name: limit
          value: "10"
          type: query
          description: "INT - Opcional - Quantidade de pedidos por página. Padrão 10, máximo 100."
        - name: pago
          value: S
          type: query
          description: "Filtra os pedidos pagos pago=S ou não pagos pago=N."
          disabled: true
        - name: created_gte
          value: 2026-07-20
          type: query
          disabled: true
        - name: page
          value: "1"
          type: query
          disabled: true
      body:
        type: form-urlencoded
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: |-
