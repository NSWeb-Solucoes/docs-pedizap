  - name: 200 Filtrar últimos pedidos considerando data da confirmação
    description: "Corte pela data: o PDV guarda a `data` do último pedido importado e envia em `data_gte`. `data` é a data da confirmação do pedido, e `status=2` deixa de fora os que não foram confirmados. Como `data_gte` é maior ou igual, o último pedido importado volta na consulta seguinte, então ignore IDs já importados. Cuidado: pagamento online aprovado depois do fechamento mantém a `data` do fechamento, e a aprovação fica em `pagto_data`. Se essa `data` já estiver abaixo do corte, o pedido não aparece. Para não perder esses casos, use `lastupdate_gte` com `order=lastupdate ASC`, porque `lastupdate` muda sempre que o pedido é salvo."
    request:
      url: "{{proto}}://{{domain}}/api/pedido"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: lastid
          value: "3200"
          type: query
          description: "INT - Opcional - Retorna os pedidos com ID maior que o informado."
          disabled: true
        - name: data_gte
          value: "2026-10-20 20:40:00"
          type: query
          description: "STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra pela data da confirmação do pedido. Maior ou igual a data."
        - name: status
          value: "2"
          type: query
          description: "INT - Opcional - Filtra pelo status. Aceita um valor por vez. Sem esse filtro, só o Carrinho (7) fica de fora."
        - name: order
          value: data ASC
          type: query
        - name: limit
          value: "10"
          type: query
          description: "INT - Opcional - Quantidade de pedidos por página. Padrão 10, máximo 100."
        - name: pago
          value: S
          type: query
          description: "Filtra os pedidos pagos pago=S ou não pagos pago=N."
          disabled: true
        - name: created_gte
          value: 2026-07-20
          type: query
          disabled: true
        - name: page
          value: "1"
          type: query
          disabled: true
      body:
        type: form-urlencoded
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
