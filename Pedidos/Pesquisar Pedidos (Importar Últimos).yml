info:
  name: Pesquisar Pedidos (Importar Últimos)
  type: http
  seq: 8
  tags:
    - Pedidos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pedido"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: lastid
      value: "3200"
      type: query
      description: "INT - Opcional - Retorna os pedidos com ID maior que o informado."
      disabled: true
    - name: data_gte
      value: "2026-10-20 20:40:00"
      type: query
      description: "STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra pela data da confirmação do pedido. Maior ou igual a data."
      disabled: true
    - name: status
      value: "2"
      type: query
      description: "INT - Opcional - Filtra pelo status. Aceita um valor por vez. Sem esse filtro, só o Carrinho (7) fica de fora."
      disabled: true
    - name: order
      value: id ASC
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: "INT - Opcional - Quantidade de pedidos por página. Padrão 10, máximo 100."
      disabled: true
    - name: pago
      value: S
      type: query
      description: "Filtra os pedidos pagos pago=S ou não pagos pago=N."
      disabled: true
    - name: created_gte
      value: 2026-07-20
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
  body:
    type: form-urlencoded
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Filtrar últimos pedidos considerando o último pedido
    description: "Corte pelo ID: o PDV guarda o maior `id` já importado e envia em `lastid`, que traz só pedidos com ID maior. Com `order=id ASC` e `limit=10`, cada consulta traz no máximo 10 pedidos, dos mais antigos para os mais novos, e a seguinte continua de onde parou. Com a ordem padrão (`id DESC`), os mais antigos seriam pulados quando houvesse mais de 10 novos. Este corte traz todos os status, menos Carrinho (7). Cuidado: o pedido `3201` ainda aguarda o PIX e, quando for pago, não volta nesta consulta, porque o ID dele já ficou abaixo do corte."
    request:
      url: "{{proto}}://{{domain}}/api/pedido"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: lastid
          value: "3200"
          type: query
          description: "INT - Opcional - Retorna os pedidos com ID maior que o informado."
        - name: data_gte
          value: "2026-10-20 20:40:00"
          type: query
          description: "STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra pela data da confirmação do pedido. Maior ou igual a data."
          disabled: true
        - name: status
          value: "2"
          type: query
          description: "INT - Opcional - Filtra pelo status. Aceita um valor por vez. Sem esse filtro, só o Carrinho (7) fica de fora."
          disabled: true
        - name: order
          value: id ASC
          type: query
        - name: limit
          value: "10"
          type: query
          description: "INT - Opcional - Quantidade de pedidos por página. Padrão 10, máximo 100."
        - name: pago
          value: S
          type: query
          description: "Filtra os pedidos pagos pago=S ou não pagos pago=N."
          disabled: true
        - name: created_gte
          value: 2026-07-20
          type: query
          disabled: true
        - name: page
          value: "1"
          type: query
          disabled: true
      body:
        type: form-urlencoded
    response:
