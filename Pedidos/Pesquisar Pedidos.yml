  - name: 200 Filtrar pedidos após um ID
    request:
      url: "{{proto}}://{{domain}}/api/pedido/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: qrcode
          value: "1"
          type: query
          disabled: true
        - name: lastid
          value: "2670"
          type: query
          description: INT - Opcional - Retorna os pedidos com ID maior que o informado.
        - name: order
          value: created DESC
          type: query
          description: "STRING - Opcional - Ordena os resultados pela coluna informada. Aceita as seguintes opções: id, data, created, lastupdate, valor e o modificador ASC/DESC em seguida. Padrão id DESC. Por pradrão vem ordenado por order decrescente do id"
          disabled: true
        - name: page
          value: "2"
          type: query
          description: INT - Opcional - Apartir do limit é criado a paginação da busca. Por padrão será a page 1
          disabled: true
        - name: data_inicio
          value: 2024-10-22
          type: query
          description: STRING (yyyy-mm-dd) - Opcional - Filtra os pedidos pela data de realização. Maior ou igual a data
          disabled: true
        - name: data_fim
          value: 2026-10-23
          type: query
          description: STRING (yyyy-mm-dd) - Opcional - Filtra os pedidos pela data de realização. Menor ou igual a data
          disabled: true
        - name: lastupdate_gte
          value: 2025-10-22
          type: query
          description: STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra os pedidos pela data da última atualização. Maior ou igual a data.
          disabled: true
        - name: lastupdate_lte
          value: 2026-10-22
          type: query
          description: STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra os pedidos pela data da última atualização. Menor ou igual a data.
          disabled: true
        - name: created_gte
          value: 2025-10-22
          type: query
          description: STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra os pedidos pela data de criação do registro. Maior ou igual a data.
          disabled: true
        - name: created_lte
          value: 2024-10-22
          type: query
          description: STRING (yyyy-mm-dd HH:MM:SS) - Opcional - Filtra os pedidos pela data de criação do registro. Menor ou igual a data
          disabled: true
        - name: returnLayout
          value: cliente,itens
          type: query
          description: STRING - Opcional - Busca informações adicionais do pedido.
          disabled: true
        - name: pago
          value: y
          type: query
          disabled: true
        - name: status
          value: "2"
          type: query
          disabled: true
        - name: limit
          value: "2"
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
