  - name: 200 Retorno com todos os dados do produto
    description: "`returnLayout=itens` adiciona o objeto `itens` em cada pedido, com todos os dados dos produtos comprados. O primeiro pedido tem dois produtos comuns. O segundo tem um produto com `extras`, e o `price` dele já soma os extras. Em um kit, os componentes também entram em `itens.item`, com `parent_id` preenchido, mas `itens.totalRegistros` conta só os produtos principais. Para receber clientes e produtos juntos, use `returnLayout=cliente,itens`."
    request:
      url: "{{proto}}://{{domain}}/api/pedido/"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
