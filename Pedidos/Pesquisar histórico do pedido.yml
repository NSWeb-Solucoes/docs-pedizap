info:
  name: Pesquisar histórico do pedido
  type: http
  seq: 5
  tags:
    - Pedidos

http:
  method: GET
  url: "{{proto}}://{{domain}}/api/pedido/histories?pedidoId={{pedidoId}}"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: pedidoId
      value: "{{pedidoId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{proto}}://{{domain}}/api/pedido/histories"
      method: GET
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: pedidoId
          value: "2658"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
