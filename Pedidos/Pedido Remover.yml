info:
  name: Pedido Remover
  type: http
  seq: 6
  tags:
    - Pedidos

http:
  method: DELETE
  url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
  headers:
    - name: Authorization
      value: "{{token}}"
    - name: Accept
      value: "{{format}}"
  params:
    - name: pedidoId
      value: "{{pedidoId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 204 Response
    description: No Content
    request:
      url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: pedidoId
          value: "{{pedidoId}}"
          type: path
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Unauthorized
    request:
      url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: pedidoId
          value: "{{pedidoId}}"
          type: path
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: text/json;charset=UTF-8
      body:
        type: text
        data: '{"status":"401","msg":"Chave de autenticação inválida."}'
  - name: 422 Pedido não encontrado
    description: O `pedidoId` não existe na loja. Neste DELETE, o erro volta sem corpo.
    request:
      url: "{{proto}}://{{domain}}/api/pedido/:pedidoId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{token}}"
        - name: Accept
          value: "{{format}}"
      params:
        - name: pedidoId
          value: "{{pedidoId}}"
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""
